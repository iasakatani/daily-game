'use strict';
var TAU=Math.PI*2;
var CV=document.getElementById('game');
var X=CV.getContext('2d');
var W=0,H=0,DPR=1;
var SANS='"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
var SERIF='"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif';
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function dist(x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy);}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  X.beginPath();
  X.moveTo(x+r,y);
  X.lineTo(x+w-r,y);
  X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);
  X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r);
  X.quadraticCurveTo(x,y,x+r,y);
  X.closePath();
}
function text(s,x,y,size,col,align,font,weight){
  X.font=(weight||700)+' '+size+'px '+(font||SANS);
  X.fillStyle=col||'#fff';
  X.textAlign=align||'center';
  X.textBaseline='middle';
  X.fillText(s,x,y);
}
function fitText(s,x,y,maxW,size,col,font,weight){
  var z=size;
  X.font=(weight||800)+' '+z+'px '+(font||SANS);
  while(X.measureText(s).width>maxW&&z>10){
    z--;
    X.font=(weight||800)+' '+z+'px '+(font||SANS);
  }
  text(s,x,y,z,col,'center',font,weight);
}
function line(x1,y1,x2,y2,col,w){
  X.strokeStyle=col;
  X.lineWidth=w||1;
  X.beginPath();
  X.moveTo(x1,y1);
  X.lineTo(x2,y2);
  X.stroke();
}
function pointSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1;
  var l=dx*dx+dy*dy;
  var t=l?clamp(((px-x1)*dx+(py-y1)*dy)/l,0,1):0;
  return dist(px,py,x1+t*dx,y1+t*dy);
}
var AU={ctx:null,ok:false,muted:false};
function audioInit(){
  if(AU.ctx){
    try{if(AU.ctx.state==='suspended')AU.ctx.resume();}catch(e){}
    return;
  }
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC){AU.ctx=new AC();AU.ok=true;}
  }catch(e){AU.ok=false;}
}
function tone(f,d,type,vol,delay,f1){
  if(!AU.ok||AU.muted)return;
  try{
    var t=AU.ctx.currentTime+(delay||0);
    var o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||.08,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AU.ctx.destination);
    o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function noise(d,freq,vol,delay){
  if(!AU.ok||AU.muted)return;
  try{
    var t=AU.ctx.currentTime+(delay||0);
    var n=Math.max(16,Math.floor(AU.ctx.sampleRate*d));
    var b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),a=b.getChannelData(0);
    for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    var src=AU.ctx.createBufferSource(),bp=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();
    src.buffer=b;bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=.8;
    g.gain.value=vol||.08;
    src.connect(bp);bp.connect(g);g.connect(AU.ctx.destination);
    src.start(t);
  }catch(e){}
}
function sClick(){tone(880,.035,'square',.045);}
function sAttach(heavy){
  tone(heavy?510:1120,.055,'square',.08,0,heavy?360:760);
  tone(heavy?90:1700,.08,'triangle',.055,.025);
}
function sCoin(){tone(1900,.12,'sine',.1);tone(2650,.18,'sine',.07,.045);tone(3400,.12,'sine',.035,.08);}
function sDrop(){tone(1350,.22,'triangle',.11,0,430);tone(760,.18,'sine',.08,.09,240);}
function sGum(){tone(150,.12,'sawtooth',.045,0,90);}
function sShake(){noise(.055,1200,.045);tone(240,.04,'square',.025);}
function sClear(){
  tone(660,.14,'triangle',.09);
  tone(880,.15,'triangle',.09,.1);
  tone(1320,.32,'triangle',.09,.21);
}
function sFail(){tone(220,.55,'sawtooth',.08,0,65);noise(.2,260,.08);}
function sCan(){noise(.08,480,.14);tone(105,.16,'square',.09,0,55);}
function sGod(){
  tone(110,1.7,'sawtooth',.09,0,55);
  tone(220,1.5,'triangle',.08,.2,880);
  noise(1.4,900,.12,.6);
}

var G={
  scene:'title',t:0,stage:0,stageTime:0,stageCollected:0,
  ptr:{x:0,y:0},pressed:false,reeling:false,reelBlockT:0,
  hand:{x:0,y:0},magnet:null,items:[],attached:[],
  run:null,buttons:[],primary:null,particles:[],popups:[],cans:[],
  dust:[],shake:0,flash:0,flashCol:'#fff',slow:0,
  ropePulse:0,ropeDamage:0,shakeHeat:0,lastSwing:0,lastReverse:0,
  spawnCan:0,stageEndT:0,interT:0,failReason:'',failTitle:'',
  finaleT:0,godRise:0,godExploded:false,resultT:0,
  hint:'',hintT:0,toast:'',toastT:0,emptyCount:0,
  pausedFrom:'play',lastTick:99,uiConsumed:false,
  fps:60,frames:0,fpsT:0
};
function layout(){
  var compact=H<610;
  var mw=Math.min(W*.78,480);
  var mh=compact?155:Math.min(226,H*.31);
  var my=compact?68:82;
  var ground=H-(compact?52:70);
  var half=Math.min(W*.43,300);
  return{
    cx:W/2,mw:mw,mh:mh,mx:W/2-mw/2,my:my,
    machineBottom:my+mh,handY:my+mh+5,
    ground:ground,floor:ground-22,half:half,
    left:W/2-half,right:W/2+half,
    grateY:ground-75,collectY:my+mh+28,
    compact:compact
  };
}
function totalAmount(){
  if(!G.run)return 0;
  var n=0;
  for(var i=0;i<G.run.records.length;i++)n+=G.run.records[i].amount;
  return n;
}
function clearedCount(){
  if(!G.run)return 0;
  var n=0;
  for(var i=0;i<G.run.records.length;i++)if(G.run.records[i].status==='clear')n++;
  return n;
}
function newRun(){
  var records=[];
  for(var i=0;i<STAGES.length;i++)records.push({status:'未着',amount:0,drops:0,time:0});
  G.run={records:records,treasures:[],retries:0,drops:0};
}
function coin(nx,value,depth,year){
  return{kind:'coin',nx:nx,value:value,depth:depth||0,year:year||'',state:'idle',r:value===500?17:14,spin:0,angle:rnd(-.3,.3),strain:0};
}
function thing(kind,nx,depth,label){
  return{kind:kind,nx:nx,depth:depth||0,label:label||kind,state:'idle',r:kind==='mudguard'?25:14,spin:0,angle:rnd(-.5,.5),strain:0,attachT:0,lastSlip:0};
}
function buildItems(si){
  var a=[];
  if(si===0){
    a.push(coin(.12,100,0));
  }else if(si===1){
    a.push(coin(-.63,100,0),coin(-.12,100,0),coin(.35,100,0),coin(.68,100,0));
    a.push(thing('gum',-.36,0,'ガム（10年もの）'));
    a.push(thing('gum',.16,0,'ガム（まだ柔らかい）'));
  }else if(si===2){
    a.push(coin(0,500,27,'平成31年'));
    a.push(thing('denture',-.58,0,'誰かの入れ歯'));
  }else if(si===3){
    a.push(coin(-.7,100,0),coin(-.35,100,0),coin(0,100,0),coin(.36,100,0),coin(.7,100,0));
    a.push(thing('screw',.55,0,'謎のネジ'));
  }else if(si===4){
    a.push(coin(.05,500,0,'平成31年'),coin(-.65,100,0));
    a.push(thing('screw',-.34,0,'ネジ（頭が丸い）'));
    a.push(thing('screw',.44,0,'ネジ（なめている）'));
    a.push(thing('key',-.48,0,'誰かの自転車の鍵'));
    a.push(thing('mudguard',.68,0,'自転車の泥除け'));
  }else if(si===5){
    a.push(coin(0,500,14,'神代'));
    a.push(thing('pottery',-.64,0,'縄文土器（なぜか磁着）'));
    a.push(thing('denture',.63,0,'神の入れ歯'));
  }
  var L=layout();
  for(var i=0;i<a.length;i++){
    a[i].id=i;
    a[i].x=L.cx+a[i].nx*L.half;
    a[i].y=L.floor-a[i].depth;
    a[i].homeX=a[i].x;a[i].homeY=a[i].y;
    a[i].vx=0;a[i].vy=0;
  }
  return a;
}
function resetStage(si){
  var L=layout(),S=STAGES[si];
  G.stage=si;G.scene='intro';G.stageTime=S.time;G.stageCollected=0;
  G.pressed=false;G.reeling=false;G.reelBlockT=0;
  G.hand.x=L.cx;G.hand.y=L.handY;
  G.magnet={x:L.cx,y:L.handY+76,vx:0,vy:0,angle:0,av:0};
  G.ptr.x=L.cx;G.ptr.y=L.handY+150;
  G.items=buildItems(si);G.attached=[];G.cans=[];
  G.ropePulse=0;G.ropeDamage=0;G.shakeHeat=0;G.lastSwing=0;
  G.spawnCan=si===3?2.5:2.0;G.stageEndT=0;G.finaleT=0;G.godRise=0;G.godExploded=false;
  G.hint=S.hint;G.hintT=7;G.emptyCount=0;G.lastTick=99;
  if(G.run){
    G.run.records[si].status='挑戦中';G.run.records[si].amount=0;
    G.run.records[si].drops=0;G.run.records[si].time=0;
    var kept=[];
    for(var i=0;i<G.run.treasures.length;i++)if(G.run.treasures[i].stage!==si)kept.push(G.run.treasures[i]);
    G.run.treasures=kept;
  }
}
function startRun(){newRun();resetStage(0);}
function beginPlay(){
  G.scene='play';G.hintT=7;
  G.primary=null;
  sClick();
}
function retryStage(){
  if(!G.run)newRun();
  G.run.retries++;
  resetStage(G.stage);
}
function goTitle(){
  G.scene='title';G.pressed=false;G.reeling=false;G.cans=[];
}
function showResult(){
  G.scene='result';G.resultT=0;G.pressed=false;G.reeling=false;
  var n=clearedCount(),mood=godMood();
  var rank=resultTitle();
  G.shareText='【本日の回収額 ¥'+fmt(totalAmount())+'】\n称号「'+rank+'」\n'+n+'/6関門クリア・神様の機嫌 '+mood+'%\nお宝: '+treasureNames()+'\n#自販機の下の500円 #ゲーム制作';
}
function godMood(){
  if(!G.run)return 0;
  return Math.round(clamp(48+clearedCount()*8-G.run.retries*4-G.run.drops*3,3,100));
}
function resultTitle(){
  var n=clearedCount();
  if(n===6)return godMood()>=85?'自販機の眷属':'小銭の仙人';
  if(n===5)return '鉄の花の庭師';
  if(n===4)return '磁力の暴走特急';
  if(n===3)return '排水溝の交渉人';
  if(n===2)return 'ガム剥がしの達人';
  if(n===1)return '百円の友';
  return '床を見つめる人';
}
function treasureNames(){
  if(!G.run||!G.run.treasures.length)return 'なし（潔白）';
  var names=[];
  for(var i=0;i<G.run.treasures.length;i++)if(names.indexOf(G.run.treasures[i].label)<0)names.push(G.run.treasures[i].label);
  return names.slice(0,5).join(' / ');
}
function addPopup(s,x,y,col,size){
  G.popups.push({s:s,x:x,y:y,t:0,life:1.25,col:col||'#fff',size:size||18});
  if(G.popups.length>12)G.popups.shift();
}
function burst(x,y,col,n,spd){
  for(var i=0;i<n;i++){
    var a=rnd(0,TAU),v=rnd(spd*.25,spd);
    G.particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,t:0,life:rnd(.35,1.1),col:col,r:rnd(1.5,4),grav:180,shape:i%3});
  }
  if(G.particles.length>260)G.particles.splice(0,G.particles.length-260);
}
function toast(s){G.toast=s;G.toastT=2.2;}
function attachedWeight(){
  var w=0;
  for(var i=0;i<G.attached.length;i++){
    var o=G.attached[i];
    w+=o.kind==='coin'?(o.value===500?1.25:.65):(o.kind==='mudguard'?3.2:o.kind==='gum'?1.2:1);
  }
  return w;
}
function attachedPos(o){
  var idx=G.attached.indexOf(o),n=G.attached.length,m=G.magnet;
  var spread=(idx-(n-1)/2)*.30;
  var a=m.angle*.35+spread;
  var rad=o.kind==='mudguard'?40:25;
  return{
    x:m.x+Math.sin(a)*rad,
    y:m.y+14+Math.cos(a)*rad*.58+(o.kind==='mudguard'?12:0),
    a:a+(o.kind==='coin'?0:m.angle*.2)
  };
}
function attach(o){
  if(o.state!=='idle')return;
  var max=G.stage>=4?9:6;
  if(G.attached.length>=max)return;
  o.state='attached';o.attachT=0;o.lastSlip=0;o.strain=0;
  G.attached.push(o);
  G.ropePulse=1;G.shake=Math.max(G.shake,o.value===500?7:3);
  G.flash=o.value===500?.18:.07;G.flashCol=o.value===500?'#ffd75a':'#dffaff';
  var p=attachedPos(o);
  burst(p.x,p.y,o.kind==='coin'?'#ffd65a':'#b8d6d8',7,75);
  sAttach(o.value===500||o.kind==='mudguard');
  if(o.value===500)addPopup('500円、確保。',p.x,p.y-28,'#ffe482',20);
  else if(o.kind==='coin')addPopup('カチッ',p.x,p.y-22,'#eafcff',14);
  else if(o.kind==='gum'){addPopup('べとっ',p.x,p.y-20,'#ff9ac2',16);sGum();}
  else addPopup(o.kind==='mudguard'?'なぜ泥除け？':'ごんっ',p.x,p.y-25,'#b8cad0',14);
}
function detach(o,fall,quiet){
  var idx=G.attached.indexOf(o);
  if(idx<0)return;
  var p=attachedPos(o);
  G.attached.splice(idx,1);
  o.x=p.x;o.y=p.y;o.angle=p.a;
  if(fall){
    o.state='falling';o.vx=G.magnet.vx*.48+rnd(-45,45);o.vy=Math.min(G.magnet.vy*.2,-20);
    o.spin=rnd(-8,8);
    if(o.kind==='coin'){
      G.slow=.32;G.shake=Math.max(G.shake,7);sDrop();
      addPopup('あっ',o.x,o.y-18,'#ffcc75',22);
    }else if(!quiet){tone(330,.09,'square',.05,0,130);}
  }else{o.state='deposited';}
}
function shakeOff(o){
  if(G.attached.indexOf(o)<0)return;
  var p=attachedPos(o);
  detach(o,true,false);
  o.strain=0;
  burst(p.x,p.y,o.kind==='gum'?'#ff8eb7':'#a9b6ba',8,110);
  addPopup(o.kind==='gum'?'ビヨーン！':'選別！',p.x,p.y-15,o.kind==='gum'?'#ff9fc5':'#d9f7ff',15);
  G.shakeHeat=Math.min(1,G.shakeHeat+.22);
}
function fail(reason,title){
  if(G.scene!=='play')return;
  G.scene='fail';G.failReason=reason;G.failTitle=title||'紐と小銭、無事ではない。';
  G.pressed=false;G.reeling=false;G.slow=.5;G.shake=12;G.flash=.22;G.flashCol='#ff5c65';
  if(G.run)G.run.records[G.stage].status='fail';
  sFail();
}
function clearStage(){
  if(G.scene!=='play')return;
  G.scene='clearing';G.stageEndT=0;G.pressed=false;G.reeling=false;
  var r=G.run.records[G.stage];r.status='clear';r.time=STAGES[G.stage].time-G.stageTime;
  G.flash=.35;G.flashCol='#ffe28a';G.shake=7;
  burst(G.magnet.x,G.magnet.y,'#ffd85e',45,230);
  sClear();
}
function deposit(){
  var L=layout();
  if(G.stage===4){
    for(var j=0;j<G.attached.length;j++){
      var q=G.attached[j];
      if(q.kind!=='coin'||q.value!==500){
        addPopup('神は選別を望んでいる',L.cx,L.handY+75,'#ff9b9b',16);
        G.reelBlockT=1.1;
        return;
      }
    }
  }
  if(!G.attached.length){
    G.emptyCount++;
    addPopup(G.emptyCount===1?'空振り。磁石も少し恥ずかしい。':'空の磁石が、静かに帰還。',L.cx,L.handY+48,'#b9c8d2',14);
    tone(230,.08,'triangle',.035);
    G.reeling=false;
    return;
  }
  var got=0,labels=[];
  var copy=G.attached.slice();
  for(var i=0;i<copy.length;i++){
    var o=copy[i],p=attachedPos(o);
    if(o.kind==='coin'){
      got+=o.value;
      if(o.year)labels.push(o.year+'の'+o.value+'円玉');
      burst(p.x,p.y,'#ffdb63',12,150);
    }else{
      labels.push(o.label);
      burst(p.x,p.y,'#b9d6d2',6,90);
    }
    detach(o,false,true);
  }
  G.stageCollected+=got;
  var rec=G.run.records[G.stage];rec.amount=G.stageCollected;
  for(var k=0;k<labels.length;k++)G.run.treasures.push({stage:G.stage,label:labels[k]});
  sCoin();
  G.flash=.16;G.flashCol='#ffe690';
  addPopup('回収 ¥'+fmt(got),L.cx,L.handY+58,'#ffe17b',24);
  G.reeling=false;
  if(G.stageCollected>=STAGES[G.stage].target){
    if(G.stage===5)startFinale();
    else clearStage();
  }else{
    G.hint='あと ¥'+fmt(STAGES[G.stage].target-G.stageCollected)+'。磁石をもう一度下ろそう。';G.hintT=4;
  }
}
function startFinale(){
  G.scene='finale';G.finaleT=0;G.godRise=0;G.godExploded=false;
  G.pressed=false;G.reeling=false;
  G.run.records[5].status='clear';
  G.run.records[5].time=STAGES[5].time-G.stageTime;
  G.run.treasures.push({stage:5,label:'自販機の御神体'});
  sGod();
}
function spawnCan(){
  var L=layout(),targetX;
  if(G.stage===5)targetX=lerp(G.hand.x,G.magnet.x,rnd(.35,.8));
  else targetX=clamp(G.magnet.x+rnd(-90,90),L.left+20,L.right-20);
  G.cans.push({x:targetX,y:L.handY-30,vy:0,state:'warn',t:0,angle:rnd(-.4,.4),hit:false,life:5});
  if(G.stage===5)tone(480,.12,'square',.045);
}
function updateCans(dt){
  var L=layout();
  for(var i=G.cans.length-1;i>=0;i--){
    var c=G.cans[i];c.t+=dt;
    if(c.state==='warn'){
      if(c.t>(G.stage===5?.72:.9)){
        c.state='fall';c.t=0;c.vy=40;c.y=L.handY-10;
        noise(.06,650,.04);
      }
    }else if(c.state==='fall'){
      c.vy+=760*dt;c.y+=c.vy*dt;c.angle+=dt*4;
      if(!c.hit&&G.magnet){
        var dRope=pointSeg(c.x,c.y,G.hand.x,G.hand.y,G.magnet.x,G.magnet.y);
        var dMag=dist(c.x,c.y,G.magnet.x,G.magnet.y);
        if(dMag<28||dRope<9){
          c.hit=true;c.state='ground';c.vy=0;c.y=Math.min(c.y,L.floor-8);
          G.shake=11;G.flash=.12;G.flashCol='#ff9a69';sCan();
          burst(c.x,c.y,'#b9d5df',16,180);
          if(G.stage===5){
            G.ropeDamage++;
            addPopup('紐が裂けた！ '+(3-G.ropeDamage)+'/'+'3',c.x,c.y-20,'#ff8383',16);
            if(G.ropeDamage>=3){fail('神の缶が、紐を三度切った。','お釣りは、天袋へ。');}
          }else{
            var coins=[];
            for(var j=0;j<G.attached.length;j++)if(G.attached[j].kind==='coin')coins.push(G.attached[j]);
            if(coins.length)detach(coins[coins.length-1],true,false);
            G.magnet.vx+=rnd(-230,230);
          }
        }
      }
      if(c.y>L.floor){
        c.y=L.floor;c.state='ground';c.t=0;sCan();
        G.shake=Math.max(G.shake,4);burst(c.x,c.y,'#9eabb0',8,90);
      }
    }else if(c.state==='ground'){
      if(c.t>2.2){G.cans.splice(i,1);continue;}
    }
  }
}
function updateItems(dt){
  var L=layout(),m=G.magnet;
  for(var i=0;i<G.items.length;i++){
    var o=G.items[i];
    if(o.state==='idle'){
      var range=G.stage>=4?(o.kind==='coin'?54:82):30;
      if(o.kind==='gum')range=29;
      if(o.kind==='denture'||o.kind==='pottery')range=31;
      var d=dist(m.x,m.y+18,o.x,o.y);
      if(d<range+(G.stage>=4?Math.sin(G.t*9+i)*8:0))attach(o);
      if(G.stage>=4&&o.state==='idle'&&d<range*1.7){
        o.x+=((m.x-o.x)/Math.max(d,1))*18*dt;
        o.y+=((m.y+12-o.y)/Math.max(d,1))*18*dt;
      }
    }else if(o.state==='attached'){
      o.attachT+=dt;
      if(o.kind==='gum'){
        if(o.attachT>1.45&&o.attachT-o.lastSlip>1.15){
          o.lastSlip=o.attachT;
          var coins=[];
          for(var c=0;c<G.attached.length;c++)if(G.attached[c].kind==='coin')coins.push(G.attached[c]);
          if(coins.length){
            detach(coins[coins.length-1],true,false);
            addPopup('ぬる…',m.x,m.y+45,'#ff9ec2',16);
          }
        }
        if(o.attachT>8&&o.strain<.75){
          fail('ガムとの距離が、紐と小銭より近くなった。','紐がガムと結婚した。');
          return;
        }
      }
    }else if(o.state==='falling'){
      o.vy+=720*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.angle+=o.spin*dt;
      o.vx*=Math.pow(.992,dt*60);
      if(o.y>=L.floor){
        o.y=L.floor;o.vy*=-.26;o.vx*=.65;o.spin*=.65;
        if(Math.abs(o.vy)<45){
          o.state='lost';o.vy=0;o.spin=0;o.angle=rnd(-.3,.3);
          if(o.kind==='coin'){
            G.run.drops++;G.run.records[G.stage].drops++;
            tone(560,.16,'triangle',.06,0,180);
            var potential=G.stageCollected;
            for(var z=0;z<G.items.length;z++){
              var p=G.items[z];
              if(p.kind==='coin'&&(p.state==='idle'||p.state==='attached'||p.state==='falling'))potential+=p.value;
            }
            if(potential<STAGES[G.stage].target){
              fail('必要な硬貨が、排水溝の彼方へ回転していった。','排水溝が、お釣りを受け取った。');
              return;
            }
          }
        }
      }
    }
  }
}
function grateBars(){
  var L=layout(),bars=[];
  for(var x=L.left+7;x<L.right;x+=42){
    if(Math.abs(x-L.cx)<28)continue;
    bars.push(x);
  }
  return bars;
}
function collideGrate(oldY){
  if(G.stage!==2)return;
  var L=layout(),m=G.magnet;
  var half=Math.abs(Math.cos(m.angle))*17+Math.abs(Math.sin(m.angle))*6;
  if(m.y+half<L.grateY-10||m.y-half>L.grateY+10)return;
  var bars=grateBars();
  for(var i=0;i<bars.length;i++){
    var bx=bars[i];
    if(Math.abs(m.x-bx)<half+4){
      var side=m.x<bx?-1:1;
      m.x=bx+side*(half+5);
      m.vx=side*Math.max(45,Math.abs(m.vx)*.4);
      if(oldY<L.grateY&&m.vy>0)m.vy=-Math.abs(m.vy)*.25;
      if(oldY>L.grateY&&m.vy<0)m.vy=Math.abs(m.vy)*.25;
      G.ropePulse=.5;G.shake=Math.max(G.shake,2);
      tone(170,.035,'square',.025);
      G.hint='横へ速く振ると、磁石が細くなる。';G.hintT=2;
      break;
    }
  }
}
function updateMagnet(dt){
  var L=layout(),m=G.magnet;
  if(!m)return;
  var weight=attachedWeight();
  var tx,ty;
  if(G.pressed){
    G.hand.x=lerp(G.hand.x,clamp(G.ptr.x,L.left,L.right),1-Math.pow(.0005,dt));
    tx=G.ptr.x;
    ty=clamp(G.ptr.y,L.handY+43,L.floor-10)+weight*2.2;
  }else if(G.reeling){
    G.hand.x=lerp(G.hand.x,L.cx,1-Math.pow(.002,dt));
    tx=L.cx;ty=L.handY+18;
    var blocked=false;
    if(G.stage===4){
      for(var i=0;i<G.attached.length;i++){
        var o=G.attached[i];
        if(o.kind!=='coin'||o.value!==500){blocked=true;break;}
      }
    }
    if(blocked){
      ty=L.handY+110;G.reelBlockT+=dt;
      if(G.reelBlockT>.75){
        G.reeling=false;G.reelBlockT=0;
        G.hint='重い！左右に速く振って、500円以外を落とす。';G.hintT=5;
        addPopup('鉄の塊が重すぎる',m.x,m.y-32,'#ff9b9b',16);
      }
    }else{G.reelBlockT=0;}
  }else{
    tx=m.x;ty=m.y;
    m.vx*=Math.pow(.25,dt);m.vy*=Math.pow(.25,dt);
  }
  var oldY=m.y;
  if(G.pressed||G.reeling){
    var k=(G.reeling?11:13)/(1+weight*.13);
    var damp=G.reeling?4.4:3.5;
    m.vx+=(tx-m.x)*k*dt;
    m.vy+=(ty-m.y)*k*dt;
    if(G.pressed)m.vy+=24*dt;
    m.vx*=Math.exp(-damp*dt);m.vy*=Math.exp(-damp*dt);
    if(G.stage>=3){
      var vibration=(G.stage===5?230:145);
      m.vx+=Math.sin(G.t*(G.stage===5?27:22))*vibration*dt;
      m.vy+=Math.sin(G.t*31)*vibration*.18*dt;
    }
    m.x+=m.vx*dt;m.y+=m.vy*dt;
  }
  m.x=clamp(m.x,L.left+10,L.right-10);
  var minY=L.handY+(G.reeling?18:35);
  m.y=clamp(m.y,minY,L.floor-7);
  collideGrate(oldY);
  var targetAngle=clamp(m.vx*.0042+Math.sin(G.t*4)*weight*.016,-1.28,1.28);
  m.av+=(targetAngle-m.angle)*20*dt;
  m.av*=Math.exp(-6*dt);m.angle+=m.av*dt;
  G.ropePulse=Math.max(0,G.ropePulse-dt*2.5);
  if(G.reeling&&m.y<L.handY+46&&Math.abs(m.x-L.cx)<70&&!G.reelBlockT)deposit();
}
function updateShake(dt){
  if(!G.pressed||!G.magnet)return;
  var vx=G.magnet.vx,sign=vx>0?1:-1;
  if(Math.abs(vx)>125){
    if(G.lastSwing&&sign!==G.lastSwing&&G.t-G.lastReverse<.65){
      G.shakeHeat=Math.min(1,G.shakeHeat+.25);
      sShake();
      for(var i=G.attached.length-1;i>=0;i--){
        var o=G.attached[i];
        var eligible=o.kind!=='coin'||(G.stage===4&&o.value!==500);
        if(eligible){
          o.strain+=o.kind==='mudguard'?.19:o.kind==='gum'?.30:.36;
          if(o.strain>=1)shakeOff(o);
        }
      }
      G.lastReverse=G.t;
    }
    G.lastSwing=sign;
  }
  G.shakeHeat=Math.max(0,G.shakeHeat-dt*.22);
}
function updateParticles(dt){
  for(var i=G.particles.length-1;i>=0;i--){
    var p=G.particles[i];p.t+=dt;
    if(p.t>p.life){G.particles.splice(i,1);continue;}
    p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(.98,dt*60);
  }
  for(var j=G.popups.length-1;j>=0;j--){
    var q=G.popups[j];q.t+=dt;q.y-=24*dt;
    if(q.t>q.life)G.popups.splice(j,1);
  }
}
function initDust(){
  G.dust=[];
  for(var i=0;i<45;i++)G.dust.push({x:Math.random(),y:Math.random(),r:rnd(.5,2),s:rnd(.02,.12),p:rnd(0,TAU)});
}
function update(dt){
  G.t+=dt;
  G.shake=Math.max(0,G.shake-dt*22);
  G.flash=Math.max(0,G.flash-dt*1.8);
  G.toastT=Math.max(0,G.toastT-dt);
  var sim=G.slow>0?dt*.27:dt;
  G.slow=Math.max(0,G.slow-dt);
  updateParticles(dt);
  if(G.scene==='play'){
    G.stageTime=Math.max(0,G.stageTime-dt);
    G.hintT=Math.max(0,G.hintT-dt);
    updateMagnet(sim);
    updateShake(sim);
    updateItems(sim);
    if(G.stage>=3){
      G.spawnCan-=dt;
      if(G.spawnCan<=0){spawnCan();G.spawnCan=G.stage===5?rnd(1.65,2.35):rnd(2.6,3.5);}
      updateCans(sim);
    }
    var sec=Math.ceil(G.stageTime);
    if(sec<=5&&sec!==G.lastTick){tone(1200,.04,'square',.045);G.lastTick=sec;}
    if(G.stageTime<=0)fail('時間切れ。500円は今夜も、自販機の下で眠る。','小銭は、宵の口に消えた。');
  }else if(G.scene==='finale'){
    G.finaleT+=dt;
    G.godRise=ease((G.finaleT-.6)/2.2);
    if(G.finaleT>2.8&&!G.godExploded){
      G.godExploded=true;G.flash=1;G.flashCol='#fff4ba';G.shake=24;
      var L=layout();burst(L.cx,L.my+L.mh/2,'#ffd34f',150,420);
      noise(.8,500,.18);tone(65,1.1,'sawtooth',.14,0,32);
    }
    if(G.finaleT>4.8)showResult();
  }else if(G.scene==='clearing'){
    G.stageEndT+=dt;
  }else if(G.scene==='result'){
    G.resultT+=dt;
  }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  CV.width=Math.round(W*DPR);CV.height=Math.round(H*DPR);
  CV.style.width=W+'px';CV.style.height=H+'px';
  X.setTransform(DPR,0,0,DPR,0,0);
  var L=layout();
  if(G.items){
    for(var i=0;i<G.items.length;i++){
      var o=G.items[i];
      if(o.state==='idle'||o.state==='lost'){
        o.x=L.cx+o.nx*L.half;o.y=L.floor-o.depth;

}

function wrapText(s,cx,y,maxW,lineH,size,col){
  var chars=s.split(''),lines=[],cur='';
  X.font='700 '+size+'px '+SANS;
  for(var i=0;i<chars.length;i++){
    if(X.measureText(cur+chars[i]).width>maxW){lines.push(cur);cur=chars[i];}
    else cur+=chars[i];
  }
  if(cur)lines.push(cur);
  for(var j=0;j<lines.length;j++)text(lines[j],cx,y+j*lineH,size,col,'center',SANS,700);
}
function drawPlayWorld(){
  drawBackground();drawMachine();drawGrate();
  drawItems(true);drawGumStrings();drawRope();drawItems(false);drawMagnet();
  drawHazards();drawParticles();drawHud();
}
function drawClearing(){
  drawPlayWorld();overlay(.64);
  var L=layout(),S=STAGES[G.stage],r=G.run.records[G.stage];
  var t=ease(G.stageEndT/.45);
  X.save();X.translate(L.cx,H*.34);X.scale(t,t);
  text('関門クリア',0,0,16,'#a8c6ce','center',SANS,800);
  text('¥'+fmt(r.amount),0,48,52,'#ffe074','center',SERIF,900);
  X.restore();
  text('回収時間 '+r.time.toFixed(1)+'秒',L.cx,H*.34+96,13,'#d3e0df','center',SANS,700);
  if(G.stageEndT>.6){
    var pw=Math.min(W-42,480);
    wrapText(S.after,L.cx,H*.34+137,pw,21,14,'#e2d9c3');
    button('next','第'+(G.stage+2)+'関門へ',L.cx-Math.min(150,W*.4),H-125,Math.min(300,W*.8),52,true,function(){resetStage(G.stage+1);});
    text('クリックで展開を送る',L.cx,H-58,10,'#79929b','center',SANS,600);
  }
}
function drawFail(){
  drawPlayWorld();overlay(.78);
  var L=layout();
  text('回収失敗',L.cx,H*.22,13,'#dc8585','center',SANS,800);
  fitText(G.failTitle,L.cx,H*.22+45,W-38,27,'#f2ddd4',SERIF,900);
  wrapText(G.failReason,L.cx,H*.22+91,W-58,21,13,'#aebfc3');
  text('今のは不運だった。磁石のせいではない。たぶん。',L.cx,H*.22+139,12,'#d1ac78','center',SANS,700);
  button('retry','この関門を即リトライ',L.cx-Math.min(165,W*.42),H-211,Math.min(330,W*.84),56,true,retryStage);
  button('result','ここまでのレシート',L.cx-Math.min(165,W*.42),H-144,Math.min(330,W*.84),43,false,showResult);
  button('title','タイトルへ',L.cx-65,H-88,130,34,false,goTitle);
}
function drawPause(){
  drawPlayWorld();overlay(.78);
  var L=layout();
  text('紐を持ったまま、休憩。',L.cx,H*.32,26,'#e9e5d6','center',SERIF,900);
  button('resume','続ける',L.cx-145,H*.32+54,290,52,true,function(){G.scene='play';sClick();});
  button('retry','この関門をやり直す',L.cx-145,H*.32+119,290,43,false,retryStage);
  button('title','タイトルへ',L.cx-65,H*.32+177,130,34,false,goTitle);
}
function drawFinale(){
  drawBackground();drawMachine();
  var L=layout();
  if(G.finaleT<2.8){
    text('500円を、賽銭として検収。',L.cx,90,17,'#ffe397','center',SERIF,900);
    text('自販機の神、起立。',L.cx,121,14,'#f2e8c5','center',SANS,800);
  }else{
    text('ご 利 益 は 、 物 理 。',L.cx,H*.25,Math.min(34,W*.07),'#fff0a3','center',SERIF,900);
    if(G.finaleT>3.6)text('自販機は昇天した。お釣りは戻ってこない。',L.cx,H*.25+49,14,'#fff4d4','center',SANS,800);
  }
  drawParticles();
}
function receiptPath(x,y,w,h,tooth){
  X.beginPath();X.moveTo(x,y+tooth);
  for(var i=0;i<=w;i+=tooth*2){
    X.lineTo(x+i,y+(i%(tooth*4)===0?0:tooth));
  }
  X.lineTo(x+w,y+h-tooth);
  for(var j=w;j>=0;j-=tooth*2)X.lineTo(x+j,y+h-(j%(tooth*4)===0?0:tooth));
  X.closePath();
}
function drawGodFaces(cx,y,mood){
  var lit=Math.round(mood/20);
  for(var i=0;i<5;i++){
    var x=cx+(i-2)*31;
    X.fillStyle=i<lit?'#c38b2d':'#b8ad99';rr(x-11,y-13,22,26,3);X.fill();
    X.strokeStyle='#574b3c';X.lineWidth=1;X.stroke();
    X.fillStyle='#f4ead0';X.fillRect(x-7,y-8,14,8);
    X.fillStyle='#392f29';X.fillRect(x-5,y-5,3,2);X.fillRect(x+2,y-5,3,2);
    X.beginPath();X.arc(x,y+5,4,0,Math.PI);X.stroke();
  }
}
function drawResult(){
  var bg=X.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#11192a');bg.addColorStop(1,'#2c2020');
  X.fillStyle=bg;X.fillRect(0,0,W,H);
  drawParticles();
  var L=layout(),rw=Math.min(W-22,450),rh=Math.min(H-18,690),rx=L.cx-rw/2,ry=(H-rh)/2;
  X.save();X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=24;
  receiptPath(rx,ry,rw,rh,6);X.fillStyle='#eee5ce';X.fill();X.shadowBlur=0;
  X.strokeStyle='#b6a98e';X.lineWidth=1;X.stroke();
  X.save();X.clip();
  for(var y=ry;y<ry+rh;y+=4)line(rx,y,rx+rw,y,'rgba(86,72,50,.018)',1);
  var n=clearedCount(),mood=godMood();
  var v=clamp((rh-118)/531,.62,1),Y=function(n){return ry+n*v;};
  text('街角磁気回収組合',L.cx,Y(25),10,'#675b4a','center',SANS,800);
  text('本 日 の 回 収 額',L.cx,Y(52),14,'#302c27','center',SERIF,900);
  text('¥'+fmt(totalAmount()),L.cx,Y(91),Math.min(43,rw*.105),'#171a1b','center',SERIF,900);
  line(rx+22,Y(119),rx+rw-22,Y(119),'#766a57',1);
  fitText('称号「'+resultTitle()+'」',L.cx,Y(141),rw-36,20,'#812f27',SERIF,900);
  text(n+' / 6 関門クリア　　リトライ '+G.run.retries+'回',L.cx,Y(169),11,'#514b42','center',SANS,700);
  var sy=Y(197);
  text('―― 関門別 回収明細 ――',L.cx,sy,10,'#675e50','center',SANS,700);
  for(var i=0;i<6;i++){
    var r=G.run.records[i],yy=sy+(22+i*22)*v;
    var mark=r.status==='clear'?'済':r.status==='fail'?'失':'―';
    text((i+1)+'. '+STAGES[i].name,rx+25,yy,11,'#373832','left',SANS,700);
    text(mark+'  ¥'+fmt(r.amount),rx+rw-25,yy,11,r.status==='clear'?'#77372b':'#716d64','right',SANS,800);
  }
  var ty=sy+166*v;
  line(rx+22,ty-10*v,rx+rw-22,ty-10*v,'#9a8d74',1);
  text('お 宝 所 持 品',rx+25,ty+5*v,10,'#675e50','left',SANS,800);
  var names=treasureNames();
  wrapTextLeft(names,rx+25,ty+26*v,rw-50,16*v,10,'#363832');
  var gy=ty+66*v;
  text('神様の機嫌  '+mood+'%',L.cx,gy,12,'#4e4032','center',SANS,900);
  drawGodFaces(L.cx,gy+31*v,mood);
  var comment=mood>=90?'「また床に落として来い」':mood>=65?'「まあ、良い回収だった」':mood>=35?'「缶は避けるものである」':'「お前の方を吸いたい」';
  text(comment,L.cx,gy+60*v,11,'#765c43','center',SERIF,700);
  var by=ry+rh-116;
  button('again','もう一度、最初から',rx+30,by,rw-60,43,true,function(){audioInit();startRun();});
  if(n<6)button('retryResult','第'+(G.stage+1)+'関門から再挑戦',rx+30,by+50,(rw-68)/2,34,false,retryStage);
  button('share','結果を共有',n<6?L.cx+4:rx+30,by+50,n<6?(rw-68)/2:rw-60,34,false,shareResult);
  text('※レシートはスクショして供養できます',L.cx,ry+rh-15,9,'#7b715f','center',SANS,600);
  X.restore();X.restore();
  if(G.toastT>0){
    rr(L.cx-120,H-49,240,34,10);X.fillStyle='rgba(8,16,23,.92)';X.fill();
    text(G.toast,L.cx,H-32,12,'#eef5e9','center',SANS,700);
  }
}
function wrapTextLeft(s,x,y,maxW,lineH,size,col){
  var chars=s.split(''),lines=[],cur='';X.font='700 '+size+'px '+SANS;
  for(var i=0;i<chars.length;i++){
    if(X.measureText(cur+chars[i]).width>maxW){lines.push(cur);cur=chars[i];}
    else cur+=chars[i];
  }
  if(cur)lines.push(cur);
  for(var j=0;j<Math.min(lines.length,2);j++)text(lines[j],x,y+j*lineH,size,col,'left',SANS,700);
}
function shareResult(){
  audioInit();sClick();
  var data={title:'自販機の下の500円を、磁石で釣り上げろ。',text:G.shareText,url:location.href};
  if(navigator.share){
    try{
      var p=navigator.share(data);
      if(p&&p.catch)p.catch(function(){});
    }catch(e){}
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
    try{
      var cp=navigator.clipboard.writeText(G.shareText+'\n'+location.href);
      if(cp&&cp.then)cp.then(function(){toast('共有文をコピーしました');},function(){toast('スクショで結果を共有！');});
    }catch(e){toast('スクショで結果を共有！');}
  }else toast('スクショで結果を共有！');
}
function render(){
  G.buttons=[];
  X.setTransform(DPR,0,0,DPR,0,0);
  X.clearRect(0,0,W,H);
  var sx=G.shake?rnd(-G.shake,G.shake):0,sy=G.shake?rnd(-G.shake,G.shake):0;
  X.save();X.translate(sx,sy);
  if(G.scene==='title')drawTitle();
  else if(G.scene==='intro')drawIntro();
  else if(G.scene==='play')drawPlayWorld();
  else if(G.scene==='clearing')drawClearing();
  else if(G.scene==='fail')drawFail();
  else if(G.scene==='pause')drawPause();
  else if(G.scene==='finale')drawFinale();
  else if(G.scene==='result')drawResult();
  X.restore();
  if(G.flash>0){X.globalAlpha=clamp(G.flash,0,1);X.fillStyle=G.flashCol;X.fillRect(0,0,W,H);X.globalAlpha=1;}
}
function pointerPos(e){
  var r=CV.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function hitButton(p){
  for(var i=G.buttons.length-1;i>=0;i--){
    var b=G.buttons[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b;
  }
  return null;
}
CV.addEventListener('pointerdown',function(e){
  e.preventDefault();audioInit();
  var p=pointerPos(e),b=hitButton(p);
  G.uiConsumed=false;
  if(b){G.uiConsumed=true;b.action();return;}
  if(G.scene==='clearing'&&G.stageEndT>.6){resetStage(G.stage+1);return;}
  if(G.scene==='play'){
    G.pressed=true;G.reeling=false;G.reelBlockT=0;
    G.ptr.x=p.x;G.ptr.y=p.y;
    G.magnet.vx+=(p.x-G.magnet.x)*1.8;
    G.magnet.vy+=(p.y-G.magnet.y)*1.2;
    G.ropePulse=.25;
    try{CV.setPointerCapture(e.pointerId);}catch(err){}
  }
},{passive:false});
CV.addEventListener('pointermove',function(e){
  if(!G.pressed||G.scene!=='play')return;
  e.preventDefault();
  var p=pointerPos(e),dx=p.x-G.ptr.x,dy=p.y-G.ptr.y;
  G.ptr.x=p.x;G.ptr.y=p.y;
  G.magnet.vx+=dx*2.3;G.magnet.vy+=dy*1.2;
},{passive:false});
function pointerRelease(e){
  if(G.pressed&&G.scene==='play'){
    e.preventDefault();G.pressed=false;G.reeling=true;G.reelBlockT=0;
    tone(260,.05,'triangle',.035,0,390);
  }
}
CV.addEventListener('pointerup',pointerRelease,{passive:false});
CV.addEventListener('pointercancel',pointerRelease,{passive:false});
CV.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='m'||k==='M'){AU.muted=!AU.muted;return;}
  if(k==='Enter'&&G.scene==='title'){audioInit();startRun();return;}
  if(k==='Enter'&&G.scene==='intro'){beginPlay();return;}
  if(k==='Escape'&&G.scene==='play'){G.scene='pause';G.pressed=false;return;}
  if(G.scene!=='play')return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(k)>=0)e.preventDefault();
  if(k===' '){G.pressed=false;G.reeling=!G.reeling;G.reelBlockT=0;return;}
  if(k.indexOf('Arrow')===0){
    if(!G.pressed){G.ptr.x=G.magnet.x;G.ptr.y=G.magnet.y;G.pressed=true;G.reeling=false;}
    if(k==='ArrowLeft')G.ptr.x-=28;
    if(k==='ArrowRight')G.ptr.x+=28;
    if(k==='ArrowUp')G.ptr.y-=25;
    if(k==='ArrowDown')G.ptr.y+=25;
    var L=layout();G.ptr.x=clamp(G.ptr.x,L.left,L.right);G.ptr.y=clamp(G.ptr.y,L.handY+40,L.floor);
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&G.scene==='play'){G.scene='pause';G.pressed=false;}
});
var last=performance.now();
function loop(now){
  var dt=clamp((now-last)/1000,0,.034);last=now;
  try{
    update(dt);
    render();
    G.frames++;G.fpsT+=dt;
    if(G.fpsT>=1){G.fps=G.frames/G.fpsT;G.frames=0;G.fpsT=0;}
  }catch(e){console.error('[loop]',e);}
  requestAnimationFrame(loop);
}
initDust();resize();requestAnimationFrame(loop);
</script>
