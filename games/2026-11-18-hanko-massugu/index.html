<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#160f0b}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    color:#2b2520;user-select:none;-webkit-user-select:none;
  }
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ===== HUD ===== */
  .hud{position:fixed;left:0;right:0;top:0;z-index:6;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;transition:opacity .25s ease}
  .hud.hidden{opacity:0}
  .hud-row{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
  .hud-doc{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:13px;letter-spacing:.08em;color:#e8d8bd;border:1px solid rgba(232,216,189,.28);border-radius:3px;padding:4px 9px 3px;white-space:nowrap;background:rgba(0,0,0,.18)}
  .hud-doc b{font-size:15px;color:#f3e6cf}
  .hud-name{font-size:12px;letter-spacing:.14em;color:rgba(240,226,205,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .hud-time{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;letter-spacing:.02em;color:#f0e2cd;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
  .hud-time.warn{color:#ff6b5e}
  .bar{max-width:520px;margin:7px auto 0;height:3px;border-radius:2px;background:rgba(240,226,205,.14);overflow:hidden}
  .bar-fill{height:100%;width:100%;background:linear-gradient(90deg,#c0322a,#e0574c);transform-origin:left center;transition:background .3s}
  .bar-fill.warn{background:linear-gradient(90deg,#ff3b2f,#ff8a5c)}

  /* ===== SCREENS ===== */
  .screen{
    position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);
    overflow-y:auto;overscroll-behavior:contain;
    background:radial-gradient(120% 90% at 50% 30%,rgba(26,18,13,.62),rgba(12,8,6,.9));
    animation:fadeIn .3s ease both;
  }
  .screen.hidden{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .card{width:100%;max-width:400px;position:relative;margin:auto 0;flex:0 0 auto;background:linear-gradient(168deg,#fdf7ea 0%,#f8f0df 52%,#f0e6d2 100%);border-radius:5px;padding:30px 26px 26px;box-shadow:0 3px 0 rgba(255,255,255,.5) inset,0 24px 50px -12px rgba(0,0,0,.78),0 0 0 1px rgba(120,96,66,.25);color:#2b2520;text-align:center}
  .card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(140,116,86,.32);border-radius:2px;pointer-events:none}

  /* ===== TITLE ===== */
  .seal-wrap{display:flex;justify-content:center;margin:2px 0 6px}
  .seal{width:76px;height:76px;transform:rotate(-7deg);opacity:.93}
  .kicker{font-size:10px;letter-spacing:.4em;color:#a08a6c;margin:0 0 10px;text-transform:uppercase;padding-left:.4em}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;font-weight:700;font-size:31px;line-height:1.36;letter-spacing:.04em;margin:0 0 16px;color:#241e1a}
  h1 em{font-style:normal;color:#c0322a;background:linear-gradient(transparent 64%,rgba(192,50,42,.16) 64%,rgba(192,50,42,.16) 94%,transparent 94%)}
  .lead{font-size:13px;line-height:1.95;color:#5b4f43;margin:0 0 18px;letter-spacing:.03em}
  .lead b{color:#241e1a;font-weight:700}
  .meta{display:flex;justify-content:center;gap:0;margin:0 0 20px;font-size:11px;letter-spacing:.1em;color:#8a7660}
  .meta span{padding:0 12px;border-right:1px solid rgba(140,116,86,.3)}
  .meta span:last-child{border-right:0}
  .meta b{color:#c0322a;font-weight:700;font-variant-numeric:tabular-nums}

  button{font-family:inherit;cursor:pointer;border:0;background:none;padding:0}
  .btn-primary{display:block;width:100%;padding:17px 10px 16px;border-radius:3px;background:linear-gradient(180deg,#cd3b32,#ab2822);color:#fff6ec;font-size:16px;font-weight:700;letter-spacing:.14em;box-shadow:0 2px 0 rgba(255,255,255,.22) inset,0 -3px 0 rgba(0,0,0,.18) inset,0 7px 16px -6px rgba(150,36,30,.7);transition:transform .08s ease,filter .18s ease}

  /* ===== RESULT ===== */

  .res-kicker{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;font-weight:700;letter-spacing:.18em;color:#241e1a}
  .res-date{font-size:10px;letter-spacing:.14em;color:#8a7660;font-variant-numeric:tabular-nums}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .rec{position:relative;background:#fbf6ea;border:1px solid rgba(140,116,86,.28);border-radius:2px;padding:4px 4px 0;box-shadow:0 2px 5px -1px rgba(80,60,40,.22);overflow:hidden}
  .rec canvas{width:100%;display:block;aspect-ratio:150/196}
  .rec-cap{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:5px 3px 6px;font-size:10px;letter-spacing:.02em;color:#6b5a49}
  .rec-cap b{font-weight:700;color:#3a312a;font-size:10.5px}
  .rec-cap i{font-style:normal;color:#b0342c;font-variant-numeric:tabular-nums}

  .score-box{display:flex;align-items:flex-end;gap:12px;border-top:1px solid rgba(140,116,86,.34);border-bottom:1px solid rgba(140,116,86,.34);padding:12px 2px 13px;margin-bottom:14px}
  .score-lab{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:12px;letter-spacing:.16em;color:#6b5a49;writing-mode:vertical-rl;line-height:1.25;height:70px;text-align:center}
  .score-num{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:64px;line-height:.9;color:#c0322a;letter-spacing:-.03em;font-variant-numeric:tabular-nums;flex-shrink:0}
  .score-num small{font-size:15px;letter-spacing:.1em;margin-left:3px;color:#a8766a;font-weight:400}
  .score-right{flex:1;padding-bottom:5px}
  .scale{position:relative;height:5px;border-radius:3px;background:linear-gradient(90deg,#dcd0b8,#b9a687 40%,#c0322a);margin-bottom:5px}
  .scale-mark{position:absolute;top:-4px;width:2px;height:13px;background:#241e1a;border-radius:1px;transform:translateX(-1px);transition:left .7s cubic-bezier(.2,.9,.25,1)}
  .scale-lab{display:flex;justify-content:space-between;font-size:9px;color:#9b866d;letter-spacing:.06em}

  .res-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:23px;line-height:1.34;letter-spacing:.04em;color:#241e1a;margin:0 0 7px}
  .res-desc{font-size:11.5px;line-height:1.8;color:#5b4f43;margin:0 0 15px;letter-spacing:.02em}

  .res-stats{display:flex;gap:1px;margin-bottom:18px;background:rgba(140,116,86,.3);border:1px solid rgba(140,116,86,.3)}
  .res-stats div{flex:1;background:#f9f3e6;padding:8px 4px 9px;text-align:center}
  .res-stats span{display:block;font-size:9px;letter-spacing:.1em;color:#8a7660;margin-bottom:3px}
  .res-stats b{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;color:#241e1a;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .res-actions{display:flex;gap:9px}
  .btn-ghost{flex:1;padding:14px 8px;border-radius:3px;font-size:13px;font-weight:700;letter-spacing:.1em;color:#4c4136;background:#f1e7d4;border:1px solid rgba(140,116,86,.45);transition:background .15s}
  .btn-ghost:active{background:#e5d9c2}
  .res-actions .btn-primary{flex:1.25;padding:14px 8px;font-size:13px;letter-spacing:.08em}
  .best-line{font-size:10px;letter-spacing:.08em;color:#8a7660;text-align:center;margin:12px 0 0}
  .best-line b{color:#c0322a}

  @media (max-width:400px){
    h1{font-size:27px}
    .card{padding:26px 20px 22px}
    .score-num{font-size:54px}
    .res-title{font-size:20px}
    .res-grid{gap:8px}
    .res-desc{margin-bottom:12px}
  }
  @media (max-height:640px){
    .seal{width:58px;height:58px}
    h1{font-size:26px;margin-bottom:12px}
    .lead{font-size:12px;margin-bottom:14px;line-height:1.8}
    .card{padding:22px 20px 20px}
  }
</style>

<script>
"use strict";
/* =========================================================
   ハンコを、まっすぐ押せ。
   ========================================================= */
const MINCHO = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif';
const GOTHIC = '"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: false });
const hudEl = document.getElementById('hud');
const hudNo = document.getElementById('hudNo');
const hudName = document.getElementById('hudName');
const hudTime = document.getElementById('hudTime');
const hudBar = document.getElementById('hudBar');

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const rnd = (a, b) => a + Math.random() * (b - a);
function srand(i, seed) {
  const x = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

let W = 0, H = 0, DPR = 1;
let bgCanvas = null, paperPattern = null;

/* ========== 音 ========== */
let AC = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') { AC.resume().catch(() => {}); } return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, slideTo) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(24, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function noiseBurst(dur, vol, cut) {
  if (!AC) return;
  try {
    const sr = AC.sampleRate, n = Math.max(1, Math.floor(sr * dur));
    const buf = AC.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2); }
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut || 1400;
    const g = AC.createGain(); g.gain.value = vol || 0.18;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start();
  } catch (e) {}
}
const SFX = {
  stamp() { tone(128, 0.13, 'sine', 0.34, 58); noiseBurst(0.09, 0.22, 1100); },
  good() { tone(784, 0.09, 'sine', 0.1); setTimeout(() => tone(1175, 0.14, 'sine', 0.08), 70); },
  miss() { tone(96, 0.2, 'sawtooth', 0.1, 52); noiseBurst(0.12, 0.14, 600); },
  flip() { noiseBurst(0.2, 0.12, 3400); tone(420, 0.08, 'triangle', 0.05, 640); },
  tick() { tone(1800, 0.03, 'square', 0.028); },
  end() { tone(523, 0.3, 'sine', 0.1); setTimeout(() => tone(659, 0.34, 'sine', 0.09), 110); setTimeout(() => tone(784, 0.5, 'sine', 0.08), 230); }
};

/* ========== 書類 ========== */
const DOCS = [
  {
    id: 'ringi', name: '稟議書',
    stamp: { shape: 'circle', text: '社印' },
    slot: { x: 0.715, y: 0.715, r: 0.098 },
    mini: ['下記の件につき、ご承認のほど', 'お願い申し上げます。'],
    render: renderRingi
  },
  {
    id: 'mitsumori', name: '見積書',
    stamp: { shape: 'square', text: '丸和' },
    slot: { x: 0.735, y: 0.755, r: 0.094 },
    mini: ['特注角印（柘植）　2 個', '合計　¥15,235（税込）'],
    render: renderMitsumori
  },
  {
    id: 'jumin', name: '住民票の写し',
    stamp: { shape: 'circle', text: '山田' },
    slot: { x: 0.695, y: 0.795, r: 0.094 },
    mini: ['氏名　山田 太郎', '東京都千代田区丸和町一丁目2番3号'],
    render: renderJumin
  },
  {
    id: 'kessai', name: '決裁書',
    stamp: { shape: 'circle', text: '決裁' },
    slot: { x: 0.635, y: 0.665, r: 0.09 },
    mini: ['件名　新製品「まっすぐハンコ」', '決裁金額　金 12,000,000 円'],
    render: renderKessai
  }
];

function T(g, s, x, y, size, o) {
  o = o || {};
  g.save();
  g.font = (o.w || 400) + ' ' + size + 'px ' + (o.f || MINCHO);
  g.fillStyle = o.c || '#332b25';
  g.textAlign = o.a || 'left';
  g.textBaseline = o.b || 'alphabetic';
  g.fillText(s, x, y);
  g.restore();
}
function spaced(g, text, cx, y, size, gap, color, weight) {
  g.save();
  g.font = (weight || 700) + ' ' + size + 'px ' + MINCHO;
  g.fillStyle = color || '#221d19';
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  const chars = Array.from(text);
  let total = 0;
  const ws = [];
  for (let i = 0; i < chars.length; i++) { const cw = g.measureText(chars[i]).width; ws.push(cw); total += cw + gap; }
  total -= gap;
  let x = cx - total / 2;
  for (let i = 0; i < chars.length; i++) { g.fillText(chars[i], x, y); x += ws[i] + gap; }
  g.restore();
}
function hline(g, x1, x2, y, w, c) {
  g.save(); g.strokeStyle = c || '#8a7b66'; g.lineWidth = w || 1;
  g.beginPath(); g.moveTo(x1, y); g.lineTo(x2, y); g.stroke(); g.restore();
}

function renderRingi(g, w, h) {
  const S = w / 400, m = w * 0.095;
  T(g, '第 2026-031 号', w * 0.9, h * 0.072, 9.5 * S, { a: 'right', c: '#5a5045' });
  T(g, '2026年11月18日', w * 0.9, h * 0.072 + 14 * S, 9.5 * S, { a: 'right', c: '#5a5045' });
  spaced(g, '稟議書', w / 2, h * 0.163, 33 * S, 9 * S, '#221d19');
  hline(g, m, w - m, h * 0.196, 1.4 * S, '#6f6355');
  hline(g, m, w - m, h * 0.196 + 4 * S, 0.7 * S, '#6f6355');
  T(g, '取締役会 御中', m, h * 0.256, 12.5 * S, { c: '#3a312a' });
  T(g, '下記の件につき、ご承認のほど', m, h * 0.312, 10.5 * S, { c: '#443a32' });
  T(g, 'お願い申し上げます。', m, h * 0.348, 10.5 * S, { c: '#443a32' });
  // 件名枠
  const bx = m, by = h * 0.385, bw = w - m * 2, bh = h * 0.185;
  g.save();
  g.fillStyle = 'rgba(190,170,140,.10)';
  g.fillRect(bx, by, bw, bh);
  g.strokeStyle = 'rgba(110,92,70,.45)'; g.lineWidth = 0.9 * S;
  g.strokeRect(bx, by, bw, bh);
  g.restore();
  T(g, '件　名', bx + 8 * S, by + 20 * S, 9.5 * S, { c: '#6b5c4b' });
  T(g, '備品（朱肉）の追加購入について', bx + 46 * S, by + 20 * S, 10 * S, { c: '#332b25' });
  T(g, '金　額', bx + 8 * S, by + 40 * S, 9.5 * S, { c: '#6b5c4b' });
  T(g, '¥3,300（税込）', bx + 46 * S, by + 40 * S, 10 * S, { c: '#332b25' });
  T(g, '納　期', bx + 8 * S, by + 60 * S, 9.5 * S, { c: '#6b5c4b' });
  T(g, '11月25日', bx + 46 * S, by + 60 * S, 10 * S, { c: '#332b25' });

/* ========== レイアウト ========== */
function buildBG() {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * DPR));
  c.height = Math.max(1, Math.round(H * DPR));
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#3b2a1f');
  lg.addColorStop(0.45, '#2a1d16');
  lg.addColorStop(1, '#170f0b');
  g.fillStyle = lg;
  g.fillRect(0, 0, W, H);

  // 木目
  g.save();
  g.strokeStyle = 'rgba(255,214,160,0.045)';
  g.lineWidth = 1;
  for (let i = 0; i < 34; i++) {
    const y = (i / 34) * H + Math.sin(i * 2.1) * 8;
    g.beginPath();
    g.moveTo(-10, y);
    for (let x = 0; x <= W + 20; x += 40) {
      g.lineTo(x, y + Math.sin(x * 0.011 + i) * 3 + Math.cos(x * 0.004 + i * 1.7) * 2);
    }
    g.stroke();
  }
  g.restore();

  // 照明
  const rg = g.createRadialGradient(W * 0.5, H * 0.34, 10, W * 0.5, H * 0.34, Math.max(W, H) * 0.72);
  rg.addColorStop(0, 'rgba(255,222,170,0.16)');
  rg.addColorStop(0.55, 'rgba(255,200,140,0.04)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);

  // 周辺減光
  const vg = g.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.32, W * 0.5, H * 0.52, Math.max(W, H) * 0.82);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);

  // 粒子
  g.save();
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(255,230,190,' + (Math.random() * 0.028).toFixed(3) + ')';
    g.fillRect(Math.random() * W, Math.random() * H, 1.2, 1.2);
  }
  g.restore();
  bgCanvas = c;
}

function buildPaperTexture() {
  const c = document.createElement('canvas');
  c.width = 140; c.height = 140;
  const g = c.getContext('2d');
  for (let i = 0; i < 2200; i++) {
    const a = Math.random() * 0.05 + 0.01;
    g.fillStyle = Math.random() > 0.5 ? 'rgba(120,95,60,' + a.toFixed(3) + ')' : 'rgba(255,255,250,' + (a * 1.4).toFixed(3) + ')';
    g.fillRect(Math.random() * 140, Math.random() * 140, Math.random() * 1.8 + 0.4, Math.random() * 1.8 + 0.4);
  }
  paperPattern = ctx.createPattern(c, 'repeat');
}

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.max(280, window.innerWidth);
  H = Math.max(320, window.innerHeight);
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const hudH = 84;
  const dockH = clamp(H * 0.185, 112, 158);
  const availH = H - hudH - dockH;
  let pw = Math.min(W - 34, 430);
  let ph = pw * 1.32;
  if (ph > availH - 14) { ph = Math.max(150, availH - 14); pw = ph / 1.32; }
  G.paper = { x: (W - pw) / 2, y: hudH + (availH - ph) / 2, w: pw, h: ph };

  const padW = clamp(W * 0.42, 132, 176);
  const padH = clamp(padW * 0.44, 56, 76);
  G.pad = { x: W / 2 - padW / 2, y: H - dockH + (dockH - padH) / 2 + 6, w: padW, h: padH };
  G.stampScale = clamp(pw / 400, 0.72, 1.12);

  buildBG();
  buildPaperTexture();
}

/* ========== 印影 ========== */
function imprintPath(g, r, seed, shape) {
  if (shape === 'square') {
    const s = r * 0.92;
    g.beginPath();
    const per = 4;
    const pts = [];
    for (let side = 0; side < 4; side++) {
      for (let i = 0; i < per; i++) {
        const t = i / per;
        let x, y;
        if (side === 0) { x = -s + 2 * s * t; y = -s; }
        else if (side === 1) { x = s; y = -s + 2 * s * t; }
        else if (side === 2) { x = s - 2 * s * t; y = s; }
        else { x = -s; y = s - 2 * s * t; }
        const wob = 1 + Math.sin(t * 9 + side * 3 + seed) * 0.018;
        pts.push([x * wob, y * wob]);
      }
    }
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) g.moveTo(pts[i][0], pts[i][1]);
      else g.lineTo(pts[i][0], pts[i][1]);
    }
    g.closePath();
    return;
  }
  const n = 40;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = r * (1 + Math.sin(a * 3 + seed) * 0.028 + Math.cos(a * 7 + seed * 2.3) * 0.018);
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
}

function drawImprint(g, cx, cy, r, im, detail) {
  if (r < 2) return;
  g.save();
  g.translate(cx, cy);
  g.rotate((im.ang || 0) * Math.PI / 180);
  const seed = im.seed || 1;
  const col = 'rgba(186,46,38,';

  // にじみ（速く押すと二重に）
  if (im.bleed > 0.2) {
    g.save();
    g.translate(im.bleed * r * 0.16, im.bleed * r * 0.1);
    imprintPath(g, r * (1.01 + im.bleed * 0.05), seed + 5, im.shape);
    g.strokeStyle = col + (0.14 * im.bleed).toFixed(3) + ')';
    g.lineWidth = r * 0.2;
    g.stroke();
    g.restore();
  }

  // 外周
  imprintPath(g, r, seed, im.shape);
  g.strokeStyle = col + '0.9)';
  g.lineWidth = r * 0.135;
  g.lineJoin = 'round';
  g.stroke();

  // 内側の面
  imprintPath(g, r * 0.985, seed + 9, im.shape);
  g.fillStyle = col + '0.055)';
  g.fill();

  // 文字
  const chars = Array.from(im.text || '印');
  g.fillStyle = col + '0.92)';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  const fs = r * (chars.length > 2 ? 0.42 : 0.55);
  g.font = '700 ' + fs + 'px ' + MINCHO;
  if (chars.length === 1) {
    g.fillText(chars[0], 0, r * 0.02);
  } else {
    const gap = r * 0.5;
    const start = -gap * (chars.length - 1) / 2;
    for (let i = 0; i < chars.length; i++) g.fillText(chars[i], 0, start + i * gap + r * 0.02);
  }

  // かすれ・粒（毎フレーム同じ配置になるよう疑似乱数を使用）
  if (detail) {
    const n = Math.round(clamp(r * 0.8, 10, 40));
    for (let i = 0; i < n; i++) {
      const a = srand(i * 4 + 1, seed) * Math.PI * 2;
      const d = (0.2 + srand(i * 4 + 2, seed) * 0.8) * r;
      const rr2 = 0.5 + srand(i * 4 + 3, seed) * 1.5;
      g.fillStyle = col + (0.05 + srand(i * 4 + 4, seed) * 0.25).toFixed(2) + ')';
      g.beginPath();
      g.arc(Math.cos(a) * d, Math.sin(a) * d, rr2, 0, Math.PI * 2);
      g.fill();
    }
    for (let i = 0; i < 5; i++) {
      const a = srand(i * 3 + 51, seed) * Math.PI * 2;
      g.fillStyle = 'rgba(250,242,226,' + (0.25 + srand(i * 3 + 52, seed) * 0.3).toFixed(2) + ')';
      g.beginPath();
      g.arc(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98, 0.6 + srand(i * 3 + 53, seed) * 1.2, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.restore();
}

/* ========== 紙 ========== */
function roundRect(g, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
}

function slotAbs(doc) {
  const P = G.paper;
  return { x: P.x + doc.slot.x * P.w, y: P.y + doc.slot.y * P.h, r: doc.slot.r * P.w };
}
// 失敗が続いたら少しだけ受付を広げる
function hitR(doc) {
  return slotAbs(doc).r * (1.2 + Math.min(G.docMiss, 2) * 0.18);
}

function drawDoc(doc, imprints, opt) {
  opt = opt || {};
  const P = G.paper, w = P.w, h = P.h;
  const alpha = opt.alpha === undefined ? 1 : opt.alpha;
  if (alpha <= 0.012) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(P.x + w / 2, P.y + h / 2 + (opt.dy || 0));
  ctx.rotate(opt.rot || 0);
  ctx.translate(-w / 2, -h / 2);

  // 影（動いていない時だけ描いて軽くする）
  if (alpha > 0.99) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 11;
    ctx.fillStyle = '#0d0805';
    roundRect(ctx, 0, 0, w, h, 3);
    ctx.fill();
    ctx.restore();
  }

  // 紙
  const pg = ctx.createLinearGradient(0, 0, w * 0.35, h);
  pg.addColorStop(0, '#fcf7ec');
  pg.addColorStop(0.5, '#f8f1e2');
  pg.addColorStop(1, '#efe4cf');
  ctx.fillStyle = pg;
  roundRect(ctx, 0, 0, w, h, 3);
  ctx.fill();

  ctx.save();
  roundRect(ctx, 0, 0, w, h, 3);
  ctx.clip();
  if (paperPattern) {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = paperPattern;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  // 端の落ち影
  const eg = ctx.createLinearGradient(0, 0, 0, h);
  eg.addColorStop(0, 'rgba(120,95,60,0.07)');
  eg.addColorStop(0.06, 'rgba(120,95,60,0)');
  eg.addColorStop(0.94, 'rgba(120,95,60,0)');
  eg.addColorStop(1, 'rgba(120,95,60,0.12)');
  ctx.fillStyle = eg;
  ctx.fillRect(0, 0, w, h);
  // 折り目
  ctx.strokeStyle = 'rgba(150,125,90,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(w * 0.5, 6);
  ctx.lineTo(w * 0.5, h - 6);
  ctx.stroke();
  ctx.restore();

  // 内枠
  ctx.strokeStyle = 'rgba(122,100,72,0.34)';
  ctx.lineWidth = 1;
  ctx.strokeRect(w * 0.032 + 0.5, h * 0.024 + 0.5, w * 0.936, h * 0.952);

  // 本文
  doc.render(ctx, w, h);

  // 印影（紙からはみ出た分は切る）
  ctx.save();
  roundRect(ctx, 0, 0, w, h, 3);
  ctx.clip();
  for (let i = 0; i < imprints.length; i++) {
    const im = imprints[i];
    drawImprint(ctx, im.nx * w, im.ny * h, im.nr * w, im, 1);
  }
  ctx.restore();
  ctx.restore();
}

function drawSlot(doc, glow) {
  const s = slotAbs(doc);
  const r = s.r;
  ctx.save();
  // ほのかな面
  const rg = ctx.createRadialGradient(s.x, s.y, r * 0.2, s.x, s.y, r * 1.25);
  rg.addColorStop(0, glow ? 'rgba(150,220,170,0.20)' : 'rgba(190,160,120,0.10)');
  rg.addColorStop(1, 'rgba(190,160,120,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.35, 0, Math.PI * 2); ctx.fill();

  ctx.setLineDash([r * 0.24, r * 0.2]);
  ctx.lineWidth = Math.max(1.2, r * 0.045);
  ctx.strokeStyle = glow ? 'rgba(52,150,92,0.95)' : 'rgba(150,128,100,0.55)';
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // 十字
  ctx.strokeStyle = glow ? 'rgba(52,150,92,0.6)' : 'rgba(150,128,100,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(s.x - r * 0.18, s.y); ctx.lineTo(s.x + r * 0.18, s.y);
  ctx.moveTo(s.x, s.y - r * 0.18); ctx.lineTo(s.x, s.y + r * 0.18);
  ctx.stroke();

  const fs = Math.max(8, r * 0.26);
  T(ctx, '捺印', s.x, s.y + r + fs * 1.15, fs, { a: 'center', c: glow ? 'rgba(38,120,72,0.95)' : 'rgba(150,128,100,0.7)', w: 700 });
  ctx.restore();
}

/* ========== 朱肉・ハンコ ========== */
function drawPad() {
  const p = G.pad;
  const r = Math.min(10, p.h * 0.22);
  // 台
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 7;
  const wg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
  wg.addColorStop(0, '#6b4a30');
  wg.addColorStop(0.5, '#4a3222');
  wg.addColorStop(1, '#2e1e15');
  ctx.fillStyle = wg;
  roundRect(ctx, p.x, p.y, p.w, p.h, r);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,220,170,0.14)';
  ctx.lineWidth = 1;
  roundRect(ctx, p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1, r);
  ctx.stroke();

  // 朱肉の面
  const ix = p.x + 10, iy = p.y + 8, iw = p.w - 20, ih = p.h - 16;
  const ig = ctx.createRadialGradient(ix + iw * 0.42, iy + ih * 0.38, 3, ix + iw / 2, iy + ih / 2, Math.max(iw, ih) * 0.62);
  ig.addColorStop(0, '#e2544a');
  ig.addColorStop(0.6, '#bf342b');
  ig.addColorStop(1, '#8d2119');
  ctx.fillStyle = ig;
  roundRect(ctx, ix, iy, iw, ih, r * 0.6);
  ctx.fill();

  ctx.save();
  roundRect(ctx, ix, iy, iw, ih, r * 0.6);
  ctx.clip();
  for (let i = 0; i < 90; i++) {
    ctx.fillStyle = 'rgba(90,16,12,' + (0.04 + srand(i, 7.3) * 0.12).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(ix + srand(i, 1.1) * iw, iy + srand(i, 2.7) * ih, 0.7 + srand(i, 5.2) * 1.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(60,10,8,0.45)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, ix + 0.5, iy + 0.5, iw - 1, ih - 1, r * 0.6);
  ctx.stroke();

  T(ctx, '朱肉', p.x + p.w / 2, p.y + p.h + 14, 9, { a: 'center', c: 'rgba(232,214,186,0.42)' });
}

function drawStampShadow(x, y, lift, sc) {
  ctx.save();
  ctx.translate(x, y + 4);
  ctx.scale(1, 0.34);
  const r = 40 * sc * (1 + lift * 0.004);
  const g = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
  g.addColorStop(0, 'rgba(0,0,0,' + (0.42 - lift * 0.004).toFixed(3) + ')');
  g.addColorStop(0.7, 'rgba(0,0,0,' + (0.2 - lift * 0.002).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStamp(x, y, angDeg, lift, press, sc) {
  const R = 33 * sc;
  ctx.save();
  // 底面は常にドラッグ位置。持ち上げはわずかに見せるだけ
  ctx.translate(x, y - lift * 0.1 + press * 3);
  ctx.rotate(angDeg * Math.PI / 180);

  const H1 = 74 * sc;   // 胴
  const H2 = 96 * sc;   // 首
  const H3 = 132 * sc;  // 頭

  // 底面（朱肉のついた面）
  ctx.fillStyle = '#3e2519';
  ctx.beginPath();
  ctx.ellipse(0, 0, R * 1.02, R * 0.34, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,38,30,0.65)';
  ctx.lineWidth = 2 * sc;
  ctx.beginPath();
  ctx.ellipse(0, 0.5, R * 0.95, R * 0.29, 0, 0, Math.PI * 2);
  ctx.stroke();

  // 胴体
  const bg = ctx.createLinearGradient(-R, 0, R, 0);
  bg.addColorStop(0, '#5c3a24');
  bg.addColorStop(0.18, '#8c5f3c');
  bg.addColorStop(0.42, '#d3a97a');
  bg.addColorStop(0.56, '#c9986a');
  bg.addColorStop(0.8, '#8a5c39');
  bg.addColorStop(1, '#4d301e');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-R * 0.98, -R * 0.2);
  ctx.bezierCurveTo(-R * 0.98, -H1 * 0.55, -R * 0.82, -H1, -R * 0.82, -H1);
  ctx.ellipse(0, -H1, R * 0.82, R * 0.28, 0, Math.PI, 0, false);
  ctx.lineTo(R * 0.98, -R * 0.2);
  ctx.ellipse(0, -R * 0.2, R * 0.98, R * 0.34, 0, 0, Math.PI, false);
  ctx.closePath();
  ctx.fill();

  // 上端の木口
  ctx.fillStyle = '#e0bb8f';
  ctx.beginPath();
  ctx.ellipse(0, -H1, R * 0.82, R * 0.27, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,55,32,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 朱の帯
  ctx.strokeStyle = 'rgba(160,40,32,0.8)';
  ctx.lineWidth = 2.4 * sc;
  ctx.beginPath();
  ctx.ellipse(0, -H1 * 0.92, R * 0.86, R * 0.2, 0, 0, Math.PI * 2);
  ctx.stroke();

  // 首
  const ng = ctx.createLinearGradient(-R * 0.3, 0, R * 0.3, 0);
  ng.addColorStop(0, '#241611');
  ng.addColorStop(0.4, '#5c4034');
  ng.addColorStop(1, '#1d120e');
  ctx.fillStyle = ng;
  roundRect(ctx, -R * 0.27, -H2, R * 0.54, H2 - H1 + 2, R * 0.1);
  ctx.fill();

  // 頭
  const hg = ctx.createLinearGradient(-R * 0.8, 0, R * 0.8, 0);
  hg.addColorStop(0, '#2a1b14');
  hg.addColorStop(0.38, '#6a4a3a');
  hg.addColorStop(0.62, '#523829');
  hg.addColorStop(1, '#1e130e');
  ctx.fillStyle = hg;
  roundRect(ctx, -R * 0.78, -H3, R * 1.56, H3 - H2 + 2, R * 0.36);
  ctx.fill();

  // 頭のつや
  ctx.save();
  roundRect(ctx, -R * 0.78, -H3, R * 1.56, H3 - H2 + 2, R * 0.36);
  ctx.clip();
  const sg = ctx.createLinearGradient(-R * 0.5, -H3, -R * 0.1, -H2);
  sg.addColorStop(0, 'rgba(255,225,190,0.22)');
  sg.addColorStop(1, 'rgba(255,225,190,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(-R, -H3, R * 2, H3 - H2 + 4);
  ctx.restore();

  // 頭の朱の飾り
  ctx.strokeStyle = 'rgba(168,44,36,0.75)';
  ctx.lineWidth = 1.6 * sc;
  ctx.beginPath();
  ctx.moveTo(-R * 0.62, -H2 - 3 * sc);
  ctx.lineTo(R * 0.62, -H2 - 3 * sc);
  ctx.stroke();

  // 押し込み時のつぶれ
  if (press > 0.01) {
    ctx.globalAlpha = press * 0.5;
    ctx.fillStyle = 'rgba(224,120,90,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 1.1, R * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ========== 進行 ========== */
function resetStampToPad() {
  const p = G.pad, s = G.stamp;
  s.x = s.tx = p.x + p.w / 2;
  s.y = s.ty = p.y + p.h * 0.52;
  s.vx = s.vy = 0;
  s.ang = 0; s.angV = 0;
  s.lift = 8; s.press = 0;
}

function prepareDoc(i) {
  G.docIndex = i;
  G.imprints = [];
  G.docMiss = 0;
  resetStampToPad();
}

function startGame() {
  audioInit();
  G.mode = 'playing';
  G.time = G.timeMax = 22;
  G.records = [];
  G.totalMiss = 0;
  G.phase = 'ready';
  G.popups = []; G.parts = [];
  G.shake = 0;
  G.tickAt = 99;
  G.lastStampT = -9;
  G.drag.on = false; G.drag.id = null;
  G.keys = {};
  prepareDoc(0);
  G.t = 0;
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  hudEl.classList.remove('hidden');
  updateHud(true);
  SFX.flip();
}

function pos(e) {
  const r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function stampNow() {
  if (G.mode !== 'playing' || G.phase !== 'ready') return;
  if (G.t - G.lastStampT < 0.22) return;
  const doc = DOCS[G.docIndex], P = G.paper, s = G.stamp;
  const nx = (s.x - P.x) / P.w, ny = (s.y - P.y) / P.h;
  if (nx < 0.02 || nx > 0.98 || ny < 0.02 || ny > 0.98) {
    SFX.tick();
    G.drag.on = false;
    return;
  }
  G.lastStampT = G.t;

  const slot = slotAbs(doc);
  const d = Math.hypot(s.x - slot.x, s.y - slot.y);
  const hit = d < hitR(doc);
  const sp = Math.hypot(s.vx, s.vy);
  const bleed = clamp(sp / 2600, 0, 1);
  const angErr = Math.abs(s.ang);
  const posN = d / slot.r;
  // 同じ書類でのはみ出しは訂正印として減点
  const missPen = Math.min(G.docMiss, 3) * 9;
  let score = Math.round(100 - angErr * 2.6 - posN * 30 - bleed * 14 - missPen);
  score = clamp(score, 4, 100);

  const im = {
    nx, ny,
    nr: (33 * G.stampScale) / P.w,
    ang: s.ang,
    seed: Math.random() * 20,
    shape: doc.stamp.shape,
    text: doc.stamp.text,
    bleed: bleed,
    ok: hit
  };
  G.imprints.push(im);

  s.press = 1;
  G.shake = hit ? 7 : 11;
  SFX.stamp();

  // インクの飛沫
  const R = 33 * G.stampScale;
  for (let i = 0; i < (hit ? 12 : 16); i++) {
    const a = rnd(0, Math.PI * 2), sp2 = rnd(40, 190);
    G.parts.push({
      x: s.x, y: s.y,
      vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2 - 40,
      life: rnd(0.35, 0.8), max: 0.8,
      r: rnd(0.8, 2.6), c: 'rgba(178,44,36,'
    });
  }
  G.parts.push({ ring: true, x: s.x, y: s.y, r: R, life: 0.45, max: 0.45 });

  if (hit) {
    G.records[G.docIndex] = {
      doc: doc, imprints: G.imprints.slice(),
      accepted: true, score: score, ang: s.ang, dist: d
    };
    G.phase = 'hold';
    G.holdT = 0;
    addPopup(('+' + score) + ' 点', s.x, s.y - 60, '#2b7a4b', 22);
    setTimeout(() => SFX.good(), 110);
  } else {
    G.docMiss++;
    G.totalMiss++;
    addPopup('はみ出し！', s.x, s.y - 60, '#c0322a', 24);
    SFX.miss();
  }
}

function addPopup(text, x, y, color, size) {
  G.popups.push({ text: text, x: x, y: y, c: color, s: size || 20, t: 0, dur: 1.15 });
}

function finish() {
  if (!G.records[G.docIndex]) {
    G.records[G.docIndex] = {
      doc: DOCS[G.docIndex], imprints: G.imprints.slice(),
      accepted: false, score: 0, ang: 0, dist: 0
    };
  }
  for (let i = 0; i < 4; i++) {
    if (!G.records[i]) {
      G.records[i] = { doc: DOCS[i], imprints: [], accepted: false, score: 0, ang: 0, dist: 0 };
    }
  }
  G.mode = 'result';
  G.phase = 'idle';
  G.drag.on = false;
  hudEl.classList.add('hidden');
  SFX.end();
  buildResult();
  document.getElementById('resultScreen').classList.remove('hidden');
}

/* ========== 更新 ========== */
function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 46);

  for (let i = G.popups.length - 1; i >= 0; i--) {
    const p = G.popups[i];
    p.t += dt;
    if (p.t > p.dur) G.popups.splice(i, 1);
  }
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    if (!p.ring) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.vx *= 0.97;
    }
  }

  if (G.mode !== 'playing') return;

  if (G.phase === 'ready') {
    G.time -= dt;
    if (G.time <= 5 && Math.ceil(G.time) !== G.tickAt) {
      G.tickAt = Math.ceil(G.time);
      if (G.tickAt > 0) SFX.tick();
    }
    if (G.time <= 0) { G.time = 0; finish(); return; }
  } else if (G.phase === 'hold') {
    G.holdT += dt;
    if (G.holdT > 0.52) {
      if (G.docIndex >= DOCS.length - 1) { finish(); return; }
      G.phase = 'trans';
      G.transT = 0;
      G.switched = false;
      SFX.flip();
    }
  } else if (G.phase === 'trans') {
    G.transT += dt;
    if (!G.switched && G.transT > 0.29) {
      G.switched = true;
      prepareDoc(G.docIndex + 1);
    }
    if (G.transT > 0.58) {
      G.phase = 'ready';
      G.transT = 0;
    }
  }

  // スタンプ物理
  const s = G.stamp;
  if (!G.drag.on) {
    const spd = 680;
    let kx = 0, ky = 0;
    if (G.keys['ArrowLeft'] || G.keys['a'] || G.keys['A']) kx -= 1;
    if (G.keys['ArrowRight'] || G.keys['d'] || G.keys['D']) kx += 1;
    if (G.keys['ArrowUp'] || G.keys['w'] || G.keys['W']) ky -= 1;
    if (G.keys['ArrowDown'] || G.keys['s'] || G.keys['S']) ky += 1;
    if (kx || ky) {
      const n = Math.hypot(kx, ky) || 1;
      s.tx += (kx / n) * spd * dt;
      s.ty += (ky / n) * spd * dt;
    }
  }
  s.tx = clamp(s.tx, 26, W - 26);
  s.ty = clamp(s.ty, 92, H - 26);

  const px = s.x, py = s.y;
  const k = 1 - Math.exp(-dt * 26);
  s.x += (s.tx - s.x) * k;
  s.y += (s.ty - s.y) * k;
  const rvx = (s.x - px) / Math.max(dt, 0.0001);
  const rvy = (s.y - py) / Math.max(dt, 0.0001);
  s.vx = lerp(s.vx, rvx, 0.55);
  s.vy = lerp(s.vy, rvy, 0.55);

  const targetAng = clamp(s.vx * 0.021, -32, 32) + Math.sin(G.t * 2.2) * 1.1 + Math.sin(G.t * 5.3 + 1.7) * 0.45;
  s.angV += ((targetAng - s.ang) * 80 - s.angV * 11) * dt;
  s.ang += s.angV * dt;
  if (s.ang > 42) { s.ang = 42; s.angV *= -0.2; }
  if (s.ang < -42) { s.ang = -42; s.angV *= -0.2; }

  s.lift = lerp(s.lift, G.drag.on ? 22 : 7, 1 - Math.exp(-dt * 11));
  if (s.press > 0) s.press = Math.max(0, s.press - dt * 4.2);

  updateHud(false);
}

let hudLast = { n: -1, name: '', time: '' };
function updateHud(force) {
  const n = Math.min(G.docIndex + 1, 4);
  if (force || hudLast.n !== n) { hudNo.textContent = String(n); hudLast.n = n; }
  const name = DOCS[G.docIndex].name;
  if (force || hudLast.name !== name) { hudName.textContent = name; hudLast.name = name; }
  const tTxt = G.time.toFixed(1);
  if (force || hudLast.time !== tTxt) {
    hudTime.textContent = tTxt;
    hudLast.time = tTxt;
    hudBar.style.transform = 'scaleX(' + clamp(G.time / G.timeMax, 0, 1) + ')';
    const warn = G.time <= 6;
    hudTime.classList.toggle('warn', warn);
    hudBar.classList.toggle('warn', warn);
  }
}

/* ========== 描画 ========== */
function drawDesk() {
  if (bgCanvas) { ctx.drawImage(bgCanvas, 0, 0, W, H); }
  else { ctx.fillStyle = '#1a120d'; ctx.fillRect(0, 0, W, H); }
}

function drawGhost(doc) {
  if (!G.drag.on || G.phase !== 'ready') return;
  const s = G.stamp, P = G.paper;
  if (s.x < P.x - 10 || s.x > P.x + P.w + 10 || s.y < P.y - 10 || s.y > P.y + P.h + 10) return;
  const slot = slotAbs(doc);
  const d = Math.hypot(s.x - slot.x, s.y - slot.y);
  const ok = d < hitR(doc);
  const r = 33 * G.stampScale;

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.ang * Math.PI / 180);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = ok ? 'rgba(46,150,92,0.13)' : 'rgba(198,68,52,0.11)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.24, 0, Math.PI * 2);
  ctx.setLineDash([r * 0.32, r * 0.24]);
  ctx.lineDashOffset = -G.t * 26;
  ctx.lineWidth = 2;
  ctx.strokeStyle = ok ? 'rgba(40,146,88,0.92)' : 'rgba(196,64,50,0.8)';
  ctx.stroke();
  ctx.setLineDash([]);
  // 傾きの軸
  ctx.strokeStyle = ok ? 'rgba(40,146,88,0.5)' : 'rgba(196,64,50,0.42)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-r * 1.35, 0); ctx.lineTo(-r * 1.06, 0);
  ctx.moveTo(r * 1.06, 0); ctx.lineTo(r * 1.35, 0);
  ctx.stroke();
  ctx.restore();

  // 角度メーター
  const a = Math.abs(s.ang);
  const col = a < 2.5 ? '#2f9160' : a < 7 ? '#c98a26' : '#c0322a';
  const label = '傾き ' + (s.ang >= 0 ? '+' : '') + s.ang.toFixed(1) + '°';
  const fs = clamp(11 * G.stampScale, 9, 13);
  ctx.save();
  ctx.font = '700 ' + fs + 'px ' + GOTHIC;
  const tw = ctx.measureText(label).width;
  let lx = s.x + 33 * G.stampScale + 12;
  if (lx + tw + 14 > W - 6) lx = s.x - 33 * G.stampScale - 12 - tw - 14;
  const ly = s.y - fs - 8;
  ctx.fillStyle = 'rgba(22,14,10,0.72)';
  roundRect(ctx, lx, ly, tw + 14, fs + 10, 3);
  ctx.fill();
  ctx.fillStyle = col;
  ctx.fillRect(lx, ly, 3, fs + 10);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  ctx.fillText(label, lx + 8, ly + (fs + 10) / 2 + 0.5);
  ctx.restore();
}

function drawFx() {
  for (let i = 0; i < G.parts.length; i++) {
    const p = G.parts[i];
    const a = p.life / p.max;
    if (p.ring) {
      const e = 1 - a;
      ctx.strokeStyle = 'rgba(196,56,46,' + (a * 0.55).toFixed(3) + ')';
      ctx.lineWidth = 3 * a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + e * 1.5), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.c + (a * 0.85).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (let i = 0; i < G.popups.length; i++) {
    const p = G.popups[i];
    const k = p.t / p.dur;
    const a = k < 0.15 ? k / 0.15 : 1 - Math.pow((k - 0.15) / 0.85, 2.2);
    const scale = 1 + Math.sin(Math.min(1, k * 4) * Math.PI * 0.5) * 0.06;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(p.x, p.y - k * 46);
    ctx.scale(scale, scale);
    ctx.font = '700 ' + p.s + 'px ' + MINCHO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(250,242,226,0.92)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.c;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}

function drawPlay() {
  ctx.save();
  if (G.shake > 0.2) {
    ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  }
  drawPad();

  const doc = DOCS[G.docIndex];
  const sc = G.stampScale;

  if (G.phase === 'trans') {
    const p = clamp(G.transT / 0.58, 0, 1);
    if (p < 0.5) {
      const e = easeInOut(p * 2);
      drawDoc(doc, G.imprints, { dy: e * 175, rot: e * 0.055, alpha: 1 - e * 0.92 });
    } else {
      const e = easeOut((p - 0.5) * 2);
      drawDoc(doc, G.imprints, { dy: -(1 - e) * 200, rot: -(1 - e) * 0.055, alpha: e });
    }
  } else {
    drawDoc(doc, G.imprints, {});
  }

  const slot = slotAbs(doc);
  const okZone = G.drag.on && Math.hypot(G.stamp.x - slot.x, G.stamp.y - slot.y) < hitR(doc);
  if (G.phase === 'ready') drawSlot(doc, okZone);

  drawGhost(doc);

  const s = G.stamp;
  drawStampShadow(s.x, s.y, s.lift, sc);
  const squash = 1 + s.press * 0.05;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(squash, 1 / squash);
  ctx.translate(-s.x, -s.y);
  drawStamp(s.x, s.y, s.ang, s.lift, s.press, sc);
  ctx.restore();

  drawFx();
  ctx.restore();
}

/* ========== リザルト ========== */
function drawMini(cv, rec) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const mw = Math.max(60, cv.clientWidth || 140);
  const mh = mw * 1.3067;
  cv.width = Math.round(mw * dpr);
  cv.height = Math.round(mh * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  g.fillStyle = '#fbf6ea';
  g.fillRect(0, 0, mw, mh);
  g.strokeStyle = 'rgba(140,116,86,0.45)';
  g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, mw - 1, mh - 1);
  g.fillStyle = '#332b25';
  g.font = '700 ' + (mw * 0.105) + 'px ' + MINCHO;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(rec.doc.name, mw / 2, mh * 0.155);
  g.strokeStyle = 'rgba(120,100,75,0.5)';
  g.beginPath();
  g.moveTo(mw * 0.12, mh * 0.235);
  g.lineTo(mw * 0.88, mh * 0.235);
  g.stroke();
  g.font = '400 ' + (mw * 0.047) + 'px ' + MINCHO;
  g.textAlign = 'left';
  g.fillStyle = 'rgba(60,50,40,0.55)';
  const lines = rec.doc.mini;
  for (let i = 0; i < lines.length; i++) g.fillText(lines[i], mw * 0.1, mh * 0.31 + i * mw * 0.1);

  for (let i = 0; i < rec.imprints.length; i++) {
    const im = rec.imprints[i];
    drawImprint(g, im.nx * mw, im.ny * mh, im.nr * mw, im, 0);
  }

  if (!rec.accepted && rec.imprints.length === 0) {
    g.save();
    g.translate(mw * 0.52, mh * 0.6);
    g.rotate(-0.16);
    g.strokeStyle = 'rgba(176,52,44,0.55)';
    g.lineWidth = 1.4;
    g.strokeRect(-mw * 0.26, -mh * 0.075, mw * 0.52, mh * 0.15);
    g.fillStyle = 'rgba(176,52,44,0.6)';
    g.font = '700 ' + (mw * 0.095) + 'px ' + MINCHO;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('未押印', 0, 1);
    g.restore();
  }
}

function pickTitle(avg, avgAng, acc, miss, bestDoc) {
  if (acc === 0) {
    return {
      name: '印影、ゼロ。',
      desc: '4枚とも白紙のまま返却されました。まずは朱肉にハンコを置くところから。'
    };
  }
  if (miss >= 3) {
    return {
      name: '伝説の訂正印',
      desc: 'はみ出した印影の数々が、もはや書類の模様になっています。訂正印の達人。'
    };
  }
  if (acc === 4 && avg >= 88) {
    return {
      name: '精密・几帳面',
      desc: '定規で測ったような印影。あなたのハンコは、1ミリも裏切らない。'
    };
  }
  if (avgAng >= 11) {
    return {
      name: '傾き' + Math.round(avgAng) + '度・経理部の風雲児',
      desc: 'いつも斜め上を行く押し方。印影が語る「急いでました」という言い訳。'
    };
  }
  if (acc < 4) {
    return {
      name: '未押印のまま退勤',
      desc: '押し終わらない書類を残して、定時で帰りました。明日やればいい。'
    };
  }
  if (avg >= 74) {
    return {
      name: '押印の申し子',
      desc: '迷いのない手つき。社内でも「あの人に押してもらうと縁起がいい」と言われています。'
    };
  }
  if (bestDoc === 3) {
    return {
      name: '決裁だけは完璧',
      desc: '最後の社長印だけ、異常な集中力。お金がかかる書類には強いタイプです。'
    };
  }
  if (avg >= 56) {
    return {
      name: 'ふつうの社会人',
      desc: '少し傾いて、少しズレて、でもちゃんと押せている。それが仕事です。'
    };
  }
  return {
    name: '朱肉の暴れ馬',
    desc: '勢いだけは一人前。印影はどれも元気いっぱいで、書類は少し困っています。'
  };
}

function buildResult() {
  const recs = G.records;
  const grid = document.getElementById('resGrid');
  grid.innerHTML = '';
  const cvsList = [];

  let sum = 0, angSum = 0, acc = 0, impTotal = 0, bestDoc = -1, bestScore = -1;
  for (let i = 0; i < 4; i++) {
    const r = recs[i];
    impTotal += r.imprints.length;
    if (r.accepted) {
      sum += r.score; angSum += Math.abs(r.ang); acc++;
      if (r.score > bestScore) { bestScore = r.score; bestDoc = i; }
    }
    const cell = document.createElement('div');
    cell.className = 'rec';
    const cv = document.createElement('canvas');
    const cap = document.createElement('div');
    cap.className = 'rec-cap';
    const b = document.createElement('b');
    b.textContent = (i + 1) + '. ' + r.doc.name;
    const it = document.createElement('i');
    if (r.accepted) {
      it.textContent = (r.ang >= 0 ? '+' : '') + r.ang.toFixed(1) + '°';
      it.style.color = Math.abs(r.ang) < 3 ? '#2f7a53' : Math.abs(r.ang) < 8 ? '#a4752a' : '#b0342c';
    } else {
      it.textContent = r.imprints.length ? '×' + r.imprints.length : '未押印';
      it.style.color = '#a1907c';
    }
    cap.appendChild(b); cap.appendChild(it);
    cell.appendChild(cv); cell.appendChild(cap);
    grid.appendChild(cell);
    cvsList.push({ cv: cv, rec: r });
  }

  const avg = sum / 4;
  const avgAng = acc ? angSum / acc : 0;
  const henti = clamp(Math.round(avg * 0.9 + 6), 22, 94);
  const title = pickTitle(avg, avgAng, acc, G.totalMiss, bestDoc);

  document.getElementById('resNum').innerHTML = henti + '<small>／100</small>';
  document.getElementById('resTitle').textContent = title.name;
  document.getElementById('resDesc').textContent = title.desc;
  document.getElementById('resMark').style.left = clamp((henti - 20) / 75 * 100, 0, 100) + '%';

  const stats = document.getElementById('resStats');
  stats.innerHTML = '';
  const rows = [
    ['平均の傾き', acc ? avgAng.toFixed(1) + '°' : '—'],
    ['訂正印', Math.max(0, impTotal - acc) + '回'],
    ['未押印', (4 - acc) + '枚']
  ];
  for (let i = 0; i < rows.length; i++) {
    const d = document.createElement('div');
    d.innerHTML = '<span>' + rows[i][0] + '</span><b>' + rows[i][1] + '</b>';
    stats.appendChild(d);
  }

  const isBest = henti > G.best;
  if (isBest) {
    G.best = henti;
    try { localStorage.setItem('hanko_best_v1', String(henti)); } catch (e) {}
  }
  document.getElementById('bestLine').innerHTML =
    (isBest ? '自己ベスト更新！ ' : '自己ベスト ') + '判子偏差値 <b>' + G.best + '</b>';

  // シェアボタン用に保持
  G.lastShare = {
    henti: henti,
    title: title.name,
    ang: avg ? avgAng.toFixed(1) : '0.0'
  };

  requestAnimationFrame(function () {
    for (let i = 0; i < cvsList.length; i++) {
      try { drawMini(cvsList[i].cv, cvsList[i].rec); } catch (e) {}
    }
  });
}

/* ========== 入力 ========== */
let touchLift = 0;

function onDown(e) {
  if (G.mode !== 'playing' || G.phase !== 'ready' || G.drag.on) return;
  e.preventDefault();
  audioInit();
  G.drag.on = true;
  G.drag.id = e.pointerId;
  touchLift = (e.pointerType === 'touch' || e.pointerType === 'pen') ? 54 : 0;
  const p = pos(e);
  G.stamp.tx = p.x;
  G.stamp.ty = p.y - touchLift;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
}
function onMove(e) {
  if (!G.drag.on || e.pointerId !== G.drag.id || G.mode !== 'playing') return;
  const p = pos(e);
  G.stamp.tx = p.x;
  G.stamp.ty = p.y - touchLift;
}
function onUp(e) {
  if (!G.drag.on || e.pointerId !== G.drag.id) return;
  G.drag.on = false;
  G.drag.id = null;
  try { cvs.releasePointerCapture(e.pointerId); } catch (err) {}
  stampNow();
}
function onCancel(e) {
  if (e.pointerId !== G.drag.id) return;
  G.drag.on = false;
  G.drag.id = null;
}
cvs.addEventListener('pointerdown', onDown, { passive: false });
cvs.addEventListener('pointermove', onMove, { passive: false });
cvs.addEventListener('pointerup', onUp, { passive: false });
cvs.addEventListener('pointercancel', onCancel, { passive: false });
cvs.addEventListener('contextmenu', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  if (G.mode === 'title') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame(); }
    return;
  }
  if (G.mode === 'result') {
    if (e.key === 'Enter') { e.preventDefault(); startGame(); }
    return;
  }
  if (G.mode !== 'playing') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(e.key) >= 0) e.preventDefault();
  G.keys[e.key] = true;
  if (e.key === ' ' && !e.repeat && G.phase === 'ready') {
    G.drag.on = false; G.drag.id = null;
    audioInit();
    stampNow();
  }
});
window.addEventListener('keyup', function (e) {
  if (G.keys[e.key]) G.keys[e.key] = false;
});
document.getElementById('startBtn').addEventListener('click', function () { this.blur(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', function () { this.blur(); startGame(); });
document.getElementById('shareBtn').addEventListener('click', function () {
  const d = G.lastShare || { henti: 0, title: '', ang: '0.0' };
  const text = '判子偏差値 ' + d.henti + '／「' + d.title + '」でした。\n' +
    '平均の傾き ' + d.ang + '度。\n' +
    '「ハンコを、まっすぐ押せ。」\n#ゲーム制作 #gamedev #ハンコ';
  const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) +
    '&url=' + encodeURIComponent(location.href);
  window.open(url, '_blank', 'noopener,noreferrer');
});

window.addEventListener('resize', function () {
  layout();
});
window.addEventListener('orientationchange', function () {
  setTimeout(layout, 220);
});

/* ========== ループ ========== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  update(dt);
  drawDesk();
  if (G.mode === 'playing') drawPlay();
  requestAnimationFrame(loop);
}

(function init() {
  layout();
  const bn = document.getElementById('bestNum');
  bn.textContent = G.best > 0 ? String(G.best) : '--';
  requestAnimationFrame(loop);
})();
</script>
