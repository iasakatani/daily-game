function updatePlay(dt){
  var f=G.fish, S=f.S, L=layout();
  if(G.anim==='rot'){
    f.rotT+=dt/0.7;
    if(f.rotT>=1){ f.angCur=f.angTo; G.anim=null; sBoneHit(); }
    else f.angCur=lerp(f.angFrom,f.angTo,ease(f.rotT)); }
  if(G.anim==='flip'){
    f.flipT+=dt/0.6;
    if(f.flipT>=1){ f.side=1-f.side; f.flipT=0; G.anim=null; sBoneHit(); } }
  if(G.anim==='open'){
    f.splitT+=dt/0.9;
    if(f.splitT>=1){ f.splitT=1; f.split=1; G.anim=null; sBoneHit(); shake(5);
      popup('開いた。上下の身が、分かれた。', {x:W/2,y:H*0.40}, 18, '#f3ead2', 1.4);
      burst({x:L.cx,y:L.cy}, 14, '#efe6cf'); }
    else f.split=ease(f.splitT); }
  // 開きドラッグ(切れ目が指に追従・繊維が伸びてちぎれる・抵抗を返す)
  if(G.openDrag){
    var od=G.openDrag, tlO=w2l(G.ptr.x,G.ptr.y);

      var dxO=tlO.x-od.sx;
      if(od.dir===0&&Math.abs(dxO)>6) od.dir=(dxO>0?1:-1);
      if(od.dir!==0&&Math.abs(tlO.y-od.sy)<24){
        var prog=clamp((tlO.x-od.sx)*od.dir/(f.fishLen*0.32),0,1);
        if(prog>od.prog){
          if(prog-od.prog>0.05) spawnOpenFibers(f,od.sx+od.dir*f.fishLen*0.32*prog);
          if(Math.random()<0.35) sCreak();
          if((od.prog<0.33&&prog>=0.33)||(od.prog<0.66&&prog>=0.66)){ shake(3); sRibcrack(); }
          od.prog=prog; } }
      if(od.prog>=1) finishOpen(f);
    } else od.closing=true;
    if(G.openDrag){
      if(od.closing){
        od.prog=Math.max(0,od.prog-dt*1.5);
        if(od.prog<=0){ G.openDrag=null; noiseAt(0.1,260,0.05); } }
      if(G.openDrag){ f.splitT=0; f.split=od.prog; } } }

  if(G.pressed&&!G.pull&&!G.anim&&!G.openDrag){ G.P=Math.min(1,G.P+dt/0.9); G.pressT+=dt; }
  else { G.P=Math.max(0,G.P-dt*3.5); G.pressT=0; }
  G.pressKick=Math.max(0,G.pressKick-dt*14);
  // 滑り(さば・皿の回転と一致する局部座標で)
  if(S.slip&&G.pressed&&!G.pull&&!G.anim){
    var pl=w2l(G.ptr.x,G.ptr.y), sf=(pl.x>0)?1:0.3;
    G.slipX=Math.min(85,G.slipX+dt*(18+72*G.P)*sf);
    if(G.P>0.3&&Math.random()<dt*6) burst({x:G.tip.x,y:G.tip.y+6},1,'#7a4520');
  } else G.slipX=Math.max(0,G.slipX-dt*300);
  // 箸先(弱圧で急に動かすと、指より遅れて身が滑る)
  var tgx=G.ptr.x+Math.cos(f.angCur)*G.slipX, tgy=G.ptr.y+Math.sin(f.angCur)*G.slipX;
  var ox=G.tip.x, oy=G.tip.y, rate=(G.pressed&&!G.anim)?(5.5+8.5*G.P):16;
  G.tip.x+=(tgx-G.tip.x)*Math.min(1,dt*rate); G.tip.y+=(tgy-G.tip.y)*Math.min(1,dt*rate);
  G.tipSpd=Math.hypot(G.tip.x-ox,G.tip.y-oy)/Math.max(dt,0.0001);
  // 引き抜き
  if(G.pull){
    var pl2=G.pull, moved=Math.hypot(G.ptr.x-pl2.x0,G.ptr.y-pl2.y0);
    if(moved>32) endPull(false,true);
    else {
      pl2.t+=dt/(pl2.kind==='t'?1.1:0.5);
      if(pl2.t>=1) endPull(true,false);
      else if(Math.random()<dt*3) burst({x:G.tip.x,y:G.tip.y},1,'#efe6cf'); } }
  f.pullFlex=(G.pull&&G.pull.kind==='t')?(0.3+0.18*Math.sin(G.t*11)):0;
  // 食べる・ストレス(開きドラッグ中は身を剥がさない)
  if(G.pressed&&!G.pull&&!G.anim&&!G.openDrag&&G.P>0.02){
    var tl=w2l(G.tip.x,G.tip.y);
    var rT=26, r2=rT*rT;

    if(inFish) f.flexDir=lerp(f.flexDir,(tl.y<0?1:-1),Math.min(1,dt*6));
    // 皮(外側の帯)は独立した剥離対象・弱圧ではめくれ強圧では裂ける
    var colHit=clamp(Math.floor((tl.x+f.fishLen/2)/(f.fishLen/f.N)),0,f.N-1);
    var sHit=tl.y<0?0:1;
    var sk=(S.flip)?((sHit===f.side)?f.skins[sHit][colHit]:null):f.skins[sHit][colHit];
    if(sk&&sk.alive){
      var sSign=(sHit===0?-1:1), off=offSide(f,sHit), rel=tl.y-off;
      if(sSign*rel>=0.70*hwA&&sSign*rel<=hwA+9){

        sk.hp-=sdps; sk.dmg=clamp(1-sk.hp/sk.max,0,1);

  for(var i3=0;i3<f.N;i3++){ var seg=f.segs[i3], ex=0;

function update(dt){

  G.shake=Math.max(0,G.shake-dt*30);
  G.flashA=Math.max(0,G.flashA-dt*2.2);
  G.hintT+=dt;
  if(G.label){ G.labelT+=dt; if(G.labelT>2.8) G.label=null; }
  if(G.curator){ G.curator.t+=dt; if(G.curator.t>G.curator.life) G.curator=null; }
  if(G.motes.length<16&&Math.random()<dt*2) G.motes.push({x:rnd(0,W),y:rnd(0,H*0.7),ph:rnd(0,TAU),r:rnd(0.8,2)});
  for(var i=0;i<G.motes.length;i++){ var m=G.motes[i]; m.ph+=dt*0.5; m.x+=Math.sin(m.ph)*dt*6; m.y-=dt*3; if(m.y<-5){ m.y=H*0.7; m.x=rnd(0,W); } }
  for(var p=G.parts.length-1;p>=0;p--){
    var pa=G.parts[p]; pa.t+=dt;

  for(var fb=G.fibers.length-1;fb>=0;fb--){ var fo=G.fibers[fb]; fo.t+=dt; if(fo.t>=fo.life) G.fibers.splice(fb,1); }
  for(var s=G.steams.length-1;s>=0;s--){ var st=G.steams[s]; st.t+=dt; if(st.t>=st.life) G.steams.splice(s,1); }
  for(var po=G.popups.length-1;po>=0;po--){ var pp=G.popups[po]; pp.t+=dt; if(pp.t>=pp.life) G.popups.splice(po,1); }
  if(G.scene==='intro'){

  } else if(G.scene==='play'){    updatePlay(dt);

}

function rrectPath(x,y,w,h,r){
  if(h<1){ X.rect(x,y,w,h); return; }
  r=Math.min(r,w/2,h/2);

  X.lineTo(x+w-r,y); X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r); X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h); X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r); X.quadraticCurveTo(x,y,x+r,y);
  X.closePath();
}

function drawSpecimen(cx,cy,w,h,S,rec,mini,float){

  pts=spinePts(f); c0=Math.floor(f.N/2); sy=pts[c0].y; sx=f.segs[c0].x;
  w=stPtr(f,sx,sy); ok=tryOpenDrag({x:w.x,y:w.y}); doOpen();
  rec('ほっけ開放:未熟は拒否',!ok&&!G.openDrag&&f.split===0&&!G.anim);
  stMid(f); update(0.05);
  G.pressed=true; stPtr(f,sx,sy); tryOpenDrag({x:G.ptr.x,y:G.ptr.y});
  half=0;
  for(k=1;k<=3;k++){ stPtr(f,sx+f.fishLen*0.09*k,sy); stSim(2); if(k===2) half=f.split; }
  G.pressed=false;
  ok=stUntil(function(){ return !G.openDrag&&f.split<0.05; },80);
  rec('ほっけ開放:途中で離すと戻る+中骨が覗く',splitReady(f)&&half>0.15&&ok);
  G.pressed=true; stPtr(f,sx,sy); tryOpenDrag({x:G.ptr.x,y:G.ptr.y});
  half=0;
  for(k=1;k<=6;k++){ stPtr(f,sx+f.fishLen*0.07*k,sy); stSim(2); if(k===4) half=f.split; }
  render(); G.pressed=false;
  rec('ほっけ開放:指で引き開ける(splitが指に追従)',f.split===1&&!G.openDrag&&half>0.5&&G.fibers.length>0);
  retryStage(); G.bannerT=2.7; update(0.05); f=G.fish; stMid(f); doOpen();
  rec('ほっけ開放:O補助でも開く(PC同等)',stUntil(function(){ return !G.anim&&f.split===1; },40));
  G.pressed=false; stAll(f);
  stGo(5); f=G.fish; G.timer=0.05; G.pressed=false;
  stUntil(function(){ return G.scene==='fail'; },20); render();
  rec('時間切れ:鯛の鯛未発見のままfail',G.scene==='fail'&&!G.run.taitaiFound&&!G.run.taitaiSwallowed&&failShareText().indexOf('焼き魚')>=0);
  retryStage(); rec('同膳リトライ(retries加算)',G.scene==='intro'&&G.run.retries===2);
  G.bannerT=2.7; update(0.05); f=G.fish; tc=f.cells[f.taitai.cell]; tc.dmg=0.6; update(0.05);
  G.pressed=true; stPtr(f,f.taitai.x,f.taitai.y+offSide(f,tc.side)); tryPull({x:G.ptr.x,y:G.ptr.y});
  flexed=false;
  stUntil(function(){ if(f.pullFlex>0.05) flexed=true; return G.run.taitaiFound; },40);
  rec('鯛の鯛:きらめき→長押し引き抜き→発見',G.run.taitaiFound&&flexed);
  G.pressed=false; stAll(f);
  ok=stUntil(function(){ return G.scene==='taitai'; },80); render();
  rec('6膳完走→鯛の鯛演出→リザルト+セーブ',ok&&stUntil(function(){ return G.scene==='result'; },160)&&G.run.saved===true);
  render();
  var txt=shareText(); doShare();
  rec('リザルト共有文(doShare)',txt.indexOf('骨格完全度')>=0);
  startRun(); rec('もう一度(startRun)',G.scene==='intro'&&G.stage===0);
  G.bannerT=2.7; update(0.05); f=G.fish; stAll(f);
  rec('零傷賛辞:折らずに第1膳クリア→館長テロップ',G.zeroPraise===true&&!!G.curator&&G.curator.text.indexOf('考古学的に完食')>=0);
  rec('セーブ合成:称号・前回ベスト退避',typeof G.prevBestAvg==='number'&&typeof G.prevLeastBrk==='number'&&!!earnedTitles().polite);
  stGo(5); f=G.fish; killCell(f,f.cells[f.taitai.cell]);
  rec('鯛の鯛:嚥下(飲み込む)もあり得る',G.run.taitaiSwallowed===true);
}
function runSelfTest(){
  if(ST.on) return;
  ST.on=true; ST.steps=[]; ST.total=0; ST.pass=0; ST.ok={};
  var errs=0, orig=null;
  try{ orig=console.error; console.error=function(){ errs++; try{ orig.apply(console,arguments); }catch(e){} }; }catch(e){}
  try{ selfTestBody(); }catch(e){ ST.fatal=String(e&&e.message||e); errs++; try{ if(orig) orig.call(console,'[selftest]',e); }catch(e2){} }
  try{ if(orig) console.error=orig; }catch(e){}
  ST.err=errs;
  try{ G.pressed=false; G.pull=null; G.openDrag=null; G.anim=null; G.curator=null; G.zeroPraise=false; newRun(); G.fish=null; G.scene='title'; }catch(e){}
  var t0=performance.now(), n=0;
  var ev=function(){ n++; if(performance.now()-t0<700) requestAnimationFrame(ev);
    else{
      ST.fps=Math.round(n/((performance.now()-t0)/1000));
      var failed=[];
      for(var i=0;i<ST.steps.length;i++) if(!ST.steps[i].ok) failed.push(ST.steps[i].step);
      try{
        if(window.__ykh) window.__ykh.testResult={ok:ST.pass===ST.total&&ST.err===0&&!ST.fatal,pass:ST.pass,total:ST.total,
          failed:failed,consoleErrors:ST.err,fatal:ST.fatal,fpsTitle:ST.fps,steps:ST.steps,ok:ST.ok,testedAt:new Date().toISOString()};
      }catch(e){}
      try{ if(evdEl) evdEl.textContent='収蔵点検 '+ST.pass+'/'+ST.total+(failed.length?' 未達:'+failed.slice(0,2).join('・'):'通過')+' 折損/小骨/回転/裏返し/開き/皮/零傷/鯛の鯛3態/共有/もう一度 fps'+ST.fps; }catch(e){}
    } };
  requestAnimationFrame(ev);
}
var last=performance.now();
function loop(now){
  try{
    var dt=(now-last)/1000;
    last=now;
    if(dt<0) dt=0;
    if(dt>0.05) dt=0.05;
    update(dt*G.timeScale);
    render();
  }catch(e){
    try{ console.error('[loop]', e); }catch(e2){}
  }
  requestAnimationFrame(loop);
}
resize();
statEl=document.getElementById('stat'); evdEl=document.getElementById('evd');
for(var mi=0;mi<14;mi++) G.motes.push({x:rnd(0,W||800),y:rnd(0,(H||600)*0.7),ph:rnd(0,TAU),r:rnd(0.8,2)});
G.save=loadSave();
newRun();
G.scene='title';
if(location.protocol==='file:'){ try{ runSelfTest(); }catch(e){} }
requestAnimationFrame(loop);
try{
  window.__ykh={ G:G, STAGES:STAGES, startRun:startRun, startStage:startStage, retryStage:retryStage,
    doRotate:doRotate, doFlip:doFlip, doOpen:doOpen, doShare:doShare, killCell:killCell,
    l2w:l2w, w2l:w2l, layout:layout, splitReady:splitReady, spinePts:spinePts, hwRaw:hwRaw, offSide:offSide,
    runSelfTest:runSelfTest, testResult:null };
}catch(e){}
</script>
